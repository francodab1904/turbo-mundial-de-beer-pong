<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copa de Plata · Turbo Mundial de Beer Pong</title>
<meta name="description" content="La revancha de los que quedaron afuera en octavos. Turbo Mundial de Beer Pong · Messi Cup.">
<meta property="og:type" content="website">
<meta property="og:title" content="🥈 Copa de Plata · Turbo Mundial de Beer Pong">
<meta property="og:description" content="La revancha de los que quedaron afuera en octavos.">
<meta property="og:image" content="https://francodab1904.github.io/turbo-mundial-de-beer-pong/preview-plata.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#111216">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111216; --panel:#17181e; --panel2:#1f2129; --line:#2c2e38;
    --text:#f2f2f4; --muted:#9a9cab; --silver:#c9ced8; --silver2:#8e96a6; --green:#2fd27a; --red:#ff4d5e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;border-right:6px solid var(--silver2)}
  header{padding:28px 20px 6px;max-width:1100px;margin:0 auto}
  .pill{display:inline-block;background:var(--silver);color:#15171c;font-weight:800;letter-spacing:3px;font-size:12px;padding:6px 12px;border-radius:6px}
  .pill + span{color:var(--muted);font-weight:600;font-size:14px;margin-left:8px}
  h1{font-family:Anton,sans-serif;font-weight:400;font-size:clamp(40px,9vw,80px);margin:10px 0 0;line-height:1;text-transform:uppercase;
     background:linear-gradient(180deg,#ffffff,#aeb5c2 55%,#7d8595);-webkit-background-clip:text;background-clip:text;color:transparent}
  h2.sub{font-family:Anton,sans-serif;font-weight:400;font-size:clamp(18px,4vw,32px);margin:4px 0 0;text-transform:uppercase;color:var(--text)}
  main{max-width:1100px;margin:0 auto;padding:6px 20px 60px}
  #live{display:none;margin:8px 0 14px;padding:10px 14px;border:1px solid var(--silver2);border-radius:10px;background:rgba(201,206,216,.08);font-size:14px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 18px}
  .btn{background:var(--silver);color:#15171c;border:0;padding:11px 18px;border-radius:10px;font-weight:800;cursor:pointer;font-size:14px}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .hint{color:var(--muted);font-size:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .bracket{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:16px;overflow-x:auto;padding-bottom:12px}
  .col{display:flex;flex-direction:column;justify-content:space-around;gap:12px;min-width:190px}
  .col h3{font-family:Anton,sans-serif;font-weight:400;text-align:center;margin:0 0 4px;color:var(--silver);letter-spacing:1px;font-size:19px;text-transform:uppercase}
  .tie{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .tie .lbl{font-size:10px;color:var(--muted);padding:6px 10px 2px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700}
  .slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;cursor:pointer;font-weight:700;font-size:14px;border-top:1px solid var(--line)}
  .slot:first-of-type{border-top:0}
  .slot:hover{background:var(--panel2)}
  .slot span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .slot.tbd{color:var(--muted);font-weight:500;font-style:italic;cursor:default}
  .slot.tbd:hover{background:transparent}
  .slot.win{background:rgba(47,210,122,.15);color:var(--green)}
  .slot.lose{color:var(--muted);text-decoration:line-through;opacity:.55}
  .slot .tag{font-size:10px;font-weight:800;color:var(--green);flex-shrink:0}
  .champ{text-align:center;padding:24px 14px;border:2px solid var(--silver);border-radius:16px;background:linear-gradient(180deg,rgba(201,206,216,.16),transparent)}
  .champ .t{font-size:52px}
  .champ .n{font-family:Anton,sans-serif;font-size:28px;color:var(--silver);text-transform:uppercase;line-height:1.1}
  .champ .p{color:var(--muted);font-size:13px;margin-top:6px}
  .empty{text-align:center;padding:40px 16px;color:var(--muted);line-height:1.6}
  .list{margin:10px auto 0;max-width:420px;text-align:left}
  .list div{padding:8px 12px;border:1px solid var(--line);border-radius:8px;margin-top:6px;color:var(--text);font-weight:700}
  .list small{display:block;color:var(--muted);font-weight:400}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:380px;width:100%}
  .modal .box p{margin:0 0 16px;line-height:1.5}
  .warn{border:1px solid var(--red);background:rgba(255,77,94,.1);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}
</style>
</head>
<body>
<header>
  <span class="pill">COPA DE PLATA 🥈</span><span>(La revancha de los caídos)</span>
  <h1>Copa de Plata</h1>
  <h2 class="sub">Turbo Mundial de Beer Pong · Messi Cup</h2>
</header>
<main>
  <div id="live"></div>
  <div id="app"></div>
</main>
<div id="modal"></div>

<script>
const PLAYERS = [
  "Ivan / Brunito / Salvu",
  "Tito / Francesca Giacomi / Luis",
  "Franco Gonzalez / Gonza I / Ema Sanchez",
  "Juanita / Mauro / Tino",
  "Botacchi / Massi / Benja Leanes",
  "Florian / Pollo / Justo Echevarria",
  "Marini / Pipe Juarez / Luli Da Cuna",
  "Juli Gariboti / Tano / Agus Hernandez",
  "Gero Vacca / Tomas Moavro / Santi Gonzalez",
  "Cento / Marcos / Pedro Guastavino",
  "Bocha / Ampi / Tincho",
  "Toto Costa / Justo Guastavino / Santi Mora",
  "Salva / Dogui / Cala"
];
const REP = "R";
const MAIN_KEY = "turbo-mundial-bp-elim-v2";       // mismo navegador que el cuadro principal
const KEY = "turbo-mundial-bp-plata-v1";
const ADMIN_CODE = "admin-mc7k2q";
const NTFY_MAIN = "https://ntfy.sh/turbo-mundial-bp-q7x3m9k2w5";
const NTFY = "https://ntfy.sh/turbo-mundial-bp-q7x3m9k2w5-plata";

// ---------- organizador ----------
let isAdmin = false;
try { isAdmin = localStorage.getItem(MAIN_KEY + "-admin") === "1"; } catch(e){}
if (location.hash.slice(1) === ADMIN_CODE){
  isAdmin = true;
  try { localStorage.setItem(MAIN_KEY + "-admin", "1"); } catch(e){}
  try { history.replaceState(null, "", location.pathname); } catch(e){ location.hash = ""; }
}

// ---------- estado ----------
// main: lo que se sabe del cuadro principal (solo lectura). P: la Copa de Plata.
let main = { names: PLAYERS.map(()=>""), slots:null, ko:{}, rep:null, t:0 };
let P = { order:null, ko:{} };
let lastP = 0, mainState = "", plataState = "", pubTimer = null;
if (isAdmin){
  try { const m = JSON.parse(localStorage.getItem(MAIN_KEY)); if (m) main = { names:m.teams.map(t=>t.name||""), slots:m.slots, ko:m.ko||{}, rep:m.rep??null, t:0 }; } catch(e){}
  try { const p = JSON.parse(localStorage.getItem(KEY)); if (p) P = p; } catch(e){}
}

const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tname = id => (main.names[id] || "").trim() || ("Equipo " + (id+1));
const okId = x => Number.isInteger(x) && x>=0 && x<PLAYERS.length;
const hhmm = t => new Date(t).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});

// perdedores de octavos del cuadro principal, sin el que volvió por repechaje. null si todavía no se sabe.
function plataTeams(){
  const s = main.slots;
  if (!s) return null;
  const out = [];
  for (let m=0;m<8;m++){
    const pair = [s[2*m], s[2*m+1]];
    if (pair.includes(null) || pair.includes(REP)) continue;
    const w = main.ko["r0m"+m];
    if (!pair.includes(w)) return null;
    out.push(pair[0]===w ? pair[1] : pair[0]);
  }
  if (!okId(main.rep) || !out.includes(main.rep)) return null;
  return out.filter(id => id !== main.rep);
}

// ---------- cuadro de plata: 5 equipos ----------
// Previa: 4° vs 5° sorteado · Semi 1: 1° vs ganador previa · Semi 2: 2° vs 3° · Final
const M = {
  p0:{lbl:"Previa"},
  s0:{lbl:"Semi 1"},
  s1:{lbl:"Semi 2"},
  f0:{lbl:"Final"}
};
function sides(m){
  const o = P.order;
  if (!o) return [{id:null,label:"A sortear"},{id:null,label:"A sortear"}];
  if (m==="p0") return [{id:o[3]},{id:o[4]}];
  if (m==="s0") return [{id:o[0]},{id:winner("p0"), label:"Ganador Previa"}];
  if (m==="s1") return [{id:o[1]},{id:o[2]}];
  return [{id:winner("s0"),label:"Ganador Semi 1"},{id:winner("s1"),label:"Ganador Semi 2"}];
}
function winner(m){
  const w = P.ko[m];
  if (w===undefined || w===null) return null;
  return sides(m).some(s=>s.id===w) ? w : null;
}

// ---------- render ----------
function banner(){
  const b = document.getElementById("live");
  b.style.display = "block";
  const st = [mainState, plataState].filter(Boolean).join(" · ");
  b.innerHTML = (isAdmin ? "<b>🔴 EN VIVO</b> · 🔑 Modo organizador: vos cargás, todos lo ven." : "<b>🔴 EN VIVO</b> · Se actualiza solo.") + (st ? " " + esc(st) : "");
}
function tie(m){
  const sd = sides(m), w = winner(m);
  const ready = sd.every(s=>s.id!==null);
  return `<div class="tie"><div class="lbl">${M[m].lbl}</div>
    ${sd.map(s=>{
      if (s.id===null) return `<div class="slot tbd">${esc(s.label||"A sortear")}</div>`;
      const cls = w===null ? "" : (w===s.id ? "win" : "lose");
      const click = ready && isAdmin ? `data-m="${m}" data-id="${s.id}"` : "";
      return `<div class="slot ${cls}" ${click} title="${esc(PLAYERS[s.id])}"><span>${esc(tname(s.id))}</span><span class="tag">${w===s.id?"PASA ✓":""}</span></div>`;
    }).join("")}
  </div>`;
}
function render(){
  const app = document.getElementById("app");
  const teams = plataTeams();
  let warn = "";
  if (isAdmin && P.order && teams && !P.order.every(id=>teams.includes(id)))
    warn = `<div class="warn">⚠️ Cambiaron los perdedores en el cuadro principal. Re-sorteá la Copa de Plata.</div>`;

  if (!P.order){
    if (!teams){
      app.innerHTML = `<div class="empty">🥈 La Copa de Plata la juegan los 5 equipos que pierden en octavos<br>(menos el que vuelve por repechaje).<br><br>Se arma cuando terminen los octavos y se sortee el repechaje del cuadro principal.</div>`;
      return;
    }
    app.innerHTML = `<div class="empty">Ya están los 5 equipos de la Copa de Plata:
      <div class="list">${teams.map(id=>`<div>${esc(tname(id))}<small>${esc(PLAYERS[id])}</small></div>`).join("")}</div>
      <br>${isAdmin ? `<button class="btn" data-act="sorteo">🎲 Sortear Copa de Plata</button>` : "Falta el sorteo. Aparece acá solo."}</div>`;
    return;
  }
  const champ = winner("f0");
  app.innerHTML = `${warn}
  ${isAdmin ? `<div class="bar"><span class="hint">Tocá al equipo que ganó y pasa. Tocá de nuevo para deshacer. 4 partidos: previa, 2 semis y final.</span></div>` : ""}
  <div class="bracket">
    <div class="col"><h3>Previa</h3>${tie("p0")}</div>
    <div class="col"><h3>Semis</h3>${tie("s0")}${tie("s1")}</div>
    <div class="col"><h3>Final</h3>${tie("f0")}</div>
    <div class="col"><h3>Campeón</h3>
      ${champ===null ? `<div class="champ"><div class="t">🥈</div><div class="p">A definir</div></div>`
        : `<div class="champ"><div class="t">🥈</div><div class="n">${esc(tname(champ))}</div><div class="p">${esc(PLAYERS[champ])}</div></div>`}
    </div>
  </div>
  ${isAdmin ? `<div class="bar" style="margin-top:28px"><button class="btn ghost" data-act="sorteo">🎲 Re-sortear Copa de Plata</button></div>` : ""}`;
}

// ---------- organizador: acciones ----------
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e){}
  clearTimeout(pubTimer); pubTimer = setTimeout(publish, 400);
}
async function publish(){
  try {
    const r = await fetch(NTFY, {method:"POST", body: JSON.stringify({v:1, t:Date.now(), o:P.order, k:P.ko})});
    plataState = r.ok ? "✅ Publicado " + hhmm(Date.now()) : "⚠️ No se pudo publicar (" + r.status + ")";
  } catch(e){ plataState = "⚠️ Sin conexión: se publica en el próximo cambio."; }
  banner();
}
function doSorteo(){
  const ids = plataTeams(); if (!ids) return;
  const a = [...ids];
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  P = { order:a, ko:{} }; save(); render();
}
function confirmBox(msg, ok){
  const m = document.getElementById("modal");
  m.innerHTML = `<div class="modal"><div class="box"><p>${msg}</p>
    <div class="bar" style="margin:0;justify-content:flex-end">
      <button class="btn ghost" id="mNo">Cancelar</button><button class="btn" id="mYes">Sí, dale</button></div></div></div>`;
  document.getElementById("mNo").onclick = ()=> m.innerHTML="";
  document.getElementById("mYes").onclick = ()=>{ m.innerHTML=""; ok(); };
}
document.getElementById("app").addEventListener("click", e=>{
  if (!isAdmin) return;
  const a = e.target.closest("[data-act]");
  if (a && a.dataset.act==="sorteo"){
    if (P.order && Object.values(P.ko).some(v=>v!==null)) confirmBox("Re-sortear borra los resultados de la Copa de Plata. ¿Seguro?", doSorteo);
    else doSorteo();
    return;
  }
  const s = e.target.closest("[data-m]");
  if (s){
    const m = s.dataset.m, id = +s.dataset.id;
    P.ko[m] = (winner(m)===id) ? null : id;
    save(); render();
  }
});

// ---------- en vivo: escuchar el cuadro principal y la Copa de Plata ----------
function unpackMain(str){
  let d; try { d = JSON.parse(str); } catch(e){ return null; }
  if (!d || d.v!==1 || typeof d.t!=="number" || !Array.isArray(d.n) || d.n.length!==PLAYERS.length) return null;
  if (d.s!==null && !(Array.isArray(d.s) && d.s.length===16 && d.s.every(x=>x===null||x===REP||okId(x)))) return null;
  if (typeof d.k!=="object" || d.k===null) return null;
  const k = {};
  for (const [key,val] of Object.entries(d.k)) if (/^r[0-3]m[0-7]$/.test(key) && (val===null||okId(val))) k[key]=val;
  return { t:d.t, names:d.n.map(x=>String(x||"").slice(0,28)), slots:d.s, ko:k, rep: okId(d.r)?d.r:null };
}
function unpackPlata(str){
  let d; try { d = JSON.parse(str); } catch(e){ return null; }
  if (!d || d.v!==1 || typeof d.t!=="number") return null;
  if (d.o!==null && !(Array.isArray(d.o) && d.o.length===5 && d.o.every(okId))) return null;
  if (typeof d.k!=="object" || d.k===null) return null;
  const k = {};
  for (const [key,val] of Object.entries(d.k)) if (/^(p0|s0|s1|f0)$/.test(key) && (val===null||okId(val))) k[key]=val;
  return { t:d.t, order:d.o, ko:k };
}
function applyMain(d){
  if (d.t <= main.t) return;
  main = d; mainState = "Cuadro principal: " + hhmm(d.t); banner(); render();
}
function applyPlata(d){
  if (isAdmin || d.t <= lastP) return;      // el organizador manda desde su celular
  lastP = d.t; P = { order:d.order, ko:d.ko }; plataState = "Copa de Plata: " + hhmm(d.t); banner(); render();
}
function listen(url, unpack, apply){
  const poll = async ()=>{
    try {
      const txt = await (await fetch(url + "/json?poll=1&since=12h")).text();
      let best = null;
      for (const line of txt.split("\n")){
        if (!line.trim()) continue;
        let o; try { o = JSON.parse(line); } catch(e){ continue; }
        if (o.event!=="message") continue;
        const d = unpack(o.message);
        if (d && (!best || d.t > best.t)) best = d;
      }
      if (best) apply(best);
    } catch(e){}
  };
  poll();
  try {
    const es = new EventSource(url + "/sse");
    es.onmessage = e => { let o; try { o = JSON.parse(e.data); } catch(err){ return; } if (o.event==="message"){ const d = unpack(o.message); if (d) apply(d); } };
    es.onopen = poll;
  } catch(e){}
  setInterval(poll, 60000);
  document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) poll(); });
}

render(); banner();
listen(NTFY_MAIN, unpackMain, applyMain);
if (!isAdmin) listen(NTFY, unpackPlata, applyPlata);
else if (P.order) publish();
</script>
</body>
</html>
