<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turbo Mundial de Beer Pong</title>
<meta name="description" content="Messi Cup · Champions League. 12 equipos, 3 grupos, cuartos, semis y final. Ganen o mueran.">
<meta property="og:type" content="website">
<meta property="og:title" content="🍺🏆 Turbo Mundial de Beer Pong">
<meta property="og:description" content="Messi Cup · Champions League. 12 equipos, 3 grupos, cuartos, semis y final.">
<meta property="og:image" content="https://francodab1904.github.io/turbo-mundial-de-beer-pong/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#111216">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#111216;--panel:#17181e;--panel2:#1f2129;--line:#2c2e38;--text:#f2f2f4;--muted:#9a9cab;--orange:#ff7a1a;--gold:#ffcf5c;--silver:#c9ced8;--green:#2fd27a;--red:#ff4d5e;--amber:#ffb020}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;border-right:6px solid #e0202a}
  header{padding:26px 20px 4px;max-width:1300px;margin:0 auto}
  .pill{display:inline-block;background:var(--orange);color:#1b0d00;font-weight:800;letter-spacing:3px;font-size:12px;padding:6px 12px;border-radius:6px}
  .pill + span{color:var(--muted);font-weight:600;font-size:14px;margin-left:8px}
  h1{font-family:Anton,sans-serif;font-weight:400;color:var(--orange);font-size:clamp(34px,8vw,72px);margin:10px 0 0;line-height:1;text-transform:uppercase}
  h2.sub{font-family:Anton,sans-serif;font-weight:400;font-size:clamp(20px,4.5vw,40px);margin:4px 0 0;text-transform:uppercase}
  h2.sub i{color:#e0202a;font-style:normal}
  nav{display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px;position:sticky;top:0;background:rgba(17,18,22,.92);backdrop-filter:blur(8px);z-index:5;max-width:1300px;margin:0 auto}
  nav button{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-weight:700;cursor:pointer;font-size:14px}
  nav button.on{background:var(--orange);color:#1b0d00;border-color:var(--orange)}
  #live{display:none;max-width:1260px;margin:0 auto 10px;padding:10px 14px;border:1px solid #e0202a;border-radius:10px;background:rgba(224,32,42,.12);font-size:14px;width:calc(100% - 40px)}
  main{max-width:1300px;margin:0 auto;padding:6px 20px 60px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 18px}
  .btn{background:var(--orange);color:#1b0d00;border:0;padding:11px 18px;border-radius:10px;font-weight:800;cursor:pointer;font-size:14px}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .hint{color:var(--muted);font-size:13px;line-height:1.5}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .groups{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
  .gtitle{font-family:Anton,sans-serif;font-weight:400;font-size:24px;letter-spacing:1px;text-transform:uppercase;color:var(--orange);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .gtitle small{font-family:Inter;font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0}
  table.tbl{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:13px;table-layout:fixed}
  .tbl th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;padding:5px 2px;text-align:center;border-bottom:1px solid var(--line)}
  .tbl td{padding:8px 2px;text-align:center;border-bottom:1px solid var(--line)}
  .tbl tr:last-child td{border-bottom:0}
  .tbl td.tn,.tbl th.tn{text-align:left;padding-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
  .tbl td.pos{border-left:4px solid transparent;font-weight:700}
  .tbl tr.z-oro td.pos{border-left-color:var(--green)}
  .tbl tr.z-ter td.pos{border-left-color:var(--amber)}
  .tbl tr.z-plata td.pos{border-left-color:var(--silver)}
  .tbl td.pts{font-weight:800;font-size:15px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:14px 0 4px}
  .legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
  .fecha{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;font-weight:700;margin:12px 0 4px}
  .match{display:grid;grid-template-columns:1fr 28px 1fr;gap:6px;align-items:center;margin:4px 0}
  .tm{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
  .tm.r{text-align:right}
  .tm.click{cursor:pointer}
  .tm.click:hover{border-color:var(--orange)}
  .tm.win{background:rgba(47,210,122,.16);border-color:var(--green);color:var(--green)}
  .tm.lose{color:var(--muted);opacity:.55;text-decoration:line-through}
  .vs{text-align:center;color:var(--muted);font-size:11px;font-weight:700}
  .bracket{display:grid;grid-template-columns:repeat(4,minmax(185px,1fr));gap:16px;overflow-x:auto;padding-bottom:12px}
  .col{display:grid;grid-template-rows:auto 1fr;gap:8px;min-width:185px}
  .col h3{font-family:Anton,sans-serif;font-weight:400;text-align:center;margin:0;color:var(--orange);letter-spacing:1px;font-size:19px;text-transform:uppercase}
  .col .ties{display:flex;flex-direction:column;justify-content:space-around;gap:12px}
  .plata .col h3{color:var(--silver)}
  .tie{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .tie .lbl{font-size:10px;color:var(--muted);padding:6px 10px 2px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700}
  .slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;font-weight:700;font-size:14px;border-top:1px solid var(--line)}
  .slot:first-of-type{border-top:0}
  .slot.click{cursor:pointer}
  .slot.click:hover{background:var(--panel2)}
  .slot span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .slot.tbd{color:var(--muted);font-weight:500;font-style:italic}
  .slot.win{background:rgba(47,210,122,.15);color:var(--green)}
  .slot.lose{color:var(--muted);text-decoration:line-through;opacity:.55}
  .slot .tag{font-size:10px;font-weight:800;color:var(--green);flex-shrink:0}
  .champ{text-align:center;padding:24px 14px;border:2px solid var(--gold);border-radius:16px;background:linear-gradient(180deg,rgba(255,207,92,.16),transparent)}
  .champ.pl{border-color:var(--silver);background:linear-gradient(180deg,rgba(201,206,216,.14),transparent)}
  .champ .t{font-size:50px}
  .champ .n{font-family:Anton,sans-serif;font-size:26px;color:var(--gold);text-transform:uppercase;line-height:1.1}
  .champ.pl .n{color:var(--silver)}
  .champ .p{color:var(--muted);font-size:13px;margin-top:6px}
  .sect{font-family:Anton,sans-serif;font-weight:400;font-size:30px;text-transform:uppercase;margin:6px 0 10px}
  .sect.oro{color:var(--gold)} .sect.pl{color:var(--silver)}
  .teams{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .teams .row{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;margin:10px 0}
  .teams .num{font-weight:800;color:var(--orange);padding-top:9px;font-size:13px}
  input.f,select.f{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:8px;font-size:14px;font-family:inherit}
  input.f.big{font-weight:800}
  input.f:disabled,select.f:disabled{opacity:1;color:var(--text);-webkit-text-fill-color:var(--text)}
  .players{color:var(--muted);font-size:13px;margin-top:4px}
  .rules{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .rules h4{margin:0 0 12px;padding-bottom:12px;border-bottom:1px solid var(--line);color:var(--orange);letter-spacing:2px;font-size:15px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
  .rules h4::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--orange)}
  .rules p{margin:0 0 12px;line-height:1.5;font-size:15px}
  .rules b{color:#fff} .rules .y{color:var(--gold);font-weight:800} .rules .r{color:var(--red);font-weight:800}
  .steps{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin:6px 0 10px}
  .steps>div{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
  .steps>div>span{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:var(--orange);color:#1b0d00;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center}
  .steps p{margin:0;font-size:15px;line-height:1.45}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:380px;width:100%}
  .modal .box p{margin:0 0 16px;line-height:1.5}
  .empty{text-align:center;padding:40px 16px;color:var(--muted);line-height:1.6}
  .adminbtn{margin-left:auto;background:transparent;border:1px solid var(--gold) !important;color:var(--gold) !important;font-size:13px !important}
</style>
</head>
<body>
<header>
  <span class="pill">REGLAS OFICIALES</span><span>(Anti viejos gaga · Ganen o Mueran)</span>
  <h1>Turbo Mundial de Beer Pong</h1>
  <h2 class="sub">Messi Cup <i>·</i> Champions League</h2>
</header>
<nav id="nav">
  <button data-v="grupos">📊 Grupos</button>
  <button data-v="llaves">🏆 Llaves</button>
  <button data-v="equipos">Equipos</button>
  <button data-v="reglas">Reglas</button>
</nav>
<div id="live"></div>
<main id="app"></main>
<div id="modal"></div>

<script>
// ===== Configuración de esta versión =====
const LIVE = true;            // true: GitHub (en vivo, solo organizador carga) · false: Claude (todos usan su copia)
const NTFY = "https://ntfy.sh/turbo-mundial-bp-v3-k4n8r2";
const ADMIN_CODE = "admin-mc7k2q";
const KEY = "tmbp-v3";

const DEFAULT_TEAMS = [
  "Ivan / Brunito / Pedro Guastavino",
  "Tito / Francesca Giacomi / Luis",
  "Franco Gonzalez / Gonza I / Ema Sanchez",
  "Juanita / Mauro / Tino",
  "Botacchi / Massi / Marcos",
  "Florian / Pollo / Justo Echevarria",
  "Marini / Pipe Juarez / Luli Da Cuna",
  "Juli Gariboti / Tano / Agus Hernandez",
  "Gero Vacca / Tomas Moavro / Santi Gonzalez",
  "Bocha / Ampi / Tincho",
  "Toto Costa / Justo Guastavino / Santi Mora",
  "Salva / Dogui / Cala"
];
const N = 12, LETTERS = ["A","B","C"];
const FECHAS = [[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
const VIEWS = ["grupos","llaves","equipos","reglas"];

// ===== organizador =====
let isAdmin = !LIVE;
if (LIVE){
  try { isAdmin = localStorage.getItem(KEY + "-admin") === "1"; } catch(e){}
  const h = location.hash.slice(1);
  if (h === ADMIN_CODE){ isAdmin = true; try{ localStorage.setItem(KEY + "-admin","1"); }catch(e){} try{ history.replaceState(null,"","#grupos"); }catch(e){} }
  if (h === "salir"){ isAdmin = false; try{ localStorage.removeItem(KEY + "-admin"); }catch(e){} try{ history.replaceState(null,"","#grupos"); }catch(e){} }
}
const RO = () => !isAdmin;

// ===== estado =====
function randTb(){ return Array.from({length:N}, ()=>Math.random()); }
function fresh(){
  return { names: Array(N).fill(""), players: [...DEFAULT_TEAMS], gn: ["Grupo A","Grupo B","Grupo C"],
           g: null, r: {}, k: {}, d: {}, tb: randTb() };
}
let S = fresh();
if (isAdmin){ try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.players) S = Object.assign(fresh(), s); } catch(e){} }
let view = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "grupos";

const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tname = id => (S.names[id]||"").trim() || ("Equipo " + (id+1));
const okId = x => Number.isInteger(x) && x>=0 && x<N;
const pkey = (a,b) => Math.min(a,b) + "-" + Math.max(a,b);
const groupIds = gi => S.g ? S.g.slice(gi*4, gi*4+4) : [null,null,null,null];

// ===== tablas =====
function standings(gi){
  const ids = groupIds(gi);
  const rows = ids.map(id=>({id, gi, pj:0, pg:0, pp:0, pts:0}));
  const by = Object.fromEntries(rows.map(r=>[r.id,r]));
  let played = 0;
  for (const f of FECHAS) for (const [i,j] of f){
    const a = ids[i], b = ids[j], w = S.r[pkey(a,b)];
    if (w!==a && w!==b) continue;
    played++;
    const W = by[w], L = by[w===a?b:a];
    W.pj++; L.pj++; W.pg++; W.pts++; L.pp++;
  }
  const rk = rank(rows, "g"+gi, true);
  return { rows: rk.rows, pend: rk.pend, done: played===6 };
}
// Desempate: 1) puntos · 2) si empatan 2, el partido entre ellos · 3) si empatan 3 o más, tiro de desempate en la mesa
function rank(rows, key, h2h, auto){
  rows.sort((x,y)=> (y.pts-x.pts) || (S.tb[y.id]-S.tb[x.id]));
  const out = [], pend = [];
  let i = 0;
  while (i < rows.length){
    let j = i; while (j < rows.length && rows[j].pts === rows[i].pts) j++;
    let cl = rows.slice(i, j);
    if (cl.length === 2 && h2h){
      const w = S.r[pkey(cl[0].id, cl[1].id)];
      if (w === cl[1].id) cl = [cl[1], cl[0]];
    } else if (cl.length >= 2 && !auto){
      const dk = key + ":" + cl[0].pts, ids = cl.map(x=>x.id), ord = (S.d||{})[dk];
      if (Array.isArray(ord) && ord.length === ids.length && ord.every(x=>ids.includes(x))) cl = ord.map(id=>cl.find(x=>x.id===id));
      else pend.push({ dk, ids, pts: cl[0].pts, partial: Array.isArray(ord) ? ord.filter(x=>ids.includes(x)) : [] });
    }
    out.push(...cl); i = j;
  }
  return { rows: out, pend };
}
const allDone = () => !!S.g && [0,1,2].every(gi=>standings(gi).done);
function thirdsRank(){ return rank([0,1,2].map(gi=>standings(gi).rows[2]), "t", false, true); }   // terceros: si empatan, sorteo
function thirds(){ return thirdsRank().rows; }
const tiesReady = () => allDone() && [0,1,2].every(gi=>standings(gi).pend.length===0) && thirdsRank().pend.length===0;

// ===== llaves =====
function qualified(){
  if (!tiesReady()) return null;
  const st = [0,1,2].map(gi=>standings(gi).rows);
  const th = thirds(), best = th.slice(0,2), worst = th[2];
  const bestG = best.map(r=>r.gi).sort().join("");
  // tercero para el 1°A y para el 1°B, sin repetir grupo
  let tA, tB;
  if (bestG === "01"){ tA = best.find(r=>r.gi===1); tB = best.find(r=>r.gi===0); }
  else if (bestG === "02"){ tA = best.find(r=>r.gi===2); tB = best.find(r=>r.gi===0); }
  else { tA = best.find(r=>r.gi===1); tB = best.find(r=>r.gi===2); }
  const plata = [worst, st[0][3], st[1][3], st[2][3]].sort((x,y)=> (y.pts-x.pts) || (S.tb[y.id]-S.tb[x.id]));
  return {
    q1:[st[0][0].id, tA.id], q2:[st[1][1].id, st[2][1].id], q3:[st[1][0].id, tB.id], q4:[st[2][0].id, st[0][1].id],
    plata: plata.map(r=>r.id), thirdsLbl: {[tA.id]:"3° "+LETTERS[tA.gi], [tB.id]:"3° "+LETTERS[tB.gi]}
  };
}
const QLBL = { q1:["1° A","Mejor 3° (B o C)"], q2:["2° B","2° C"], q3:["1° B","Mejor 3° (A o C)"], q4:["1° C","2° A"] };
const KO = {
  q1:{lbl:"Cuartos 1"}, q2:{lbl:"Cuartos 2"}, q3:{lbl:"Cuartos 3"}, q4:{lbl:"Cuartos 4"},
  s1:{lbl:"Semi 1", from:["q1","q2"]}, s2:{lbl:"Semi 2", from:["q3","q4"]}, f:{lbl:"Final de Oro", from:["s1","s2"]}
};
function sides(m){
  const Q = qualified();
  if (m[0]==="q"){
    if (!Q) return QLBL[m].map(l=>({id:null,label:l}));
    return Q[m].map(id=>({id}));
  }
  return KO[m].from.map(x=>({id:winner(x), label:"Ganador " + KO[x].lbl}));
}
function winner(m){
  const w = S.k[m];
  if (!okId(w)) return null;
  return sides(m).some(s=>s.id===w) ? w : null;
}

// ===== render =====
function render(){
  document.querySelectorAll("#nav button[data-v]").forEach(b=>b.classList.toggle("on", b.dataset.v===view));
  const app = document.getElementById("app");
  app.innerHTML = view==="llaves" ? vLlaves() : view==="equipos" ? vEquipos() : view==="reglas" ? vReglas() : vGrupos();
}

function pendBox(p, show){
  if (!show) return "";
  const n = p.ids.length;
  if (RO()) return `<div class="card" style="border-color:var(--amber);margin:4px 0 12px;padding:10px 12px"><b style="color:var(--amber)">🎯 Desempate en la mesa</b><div class="hint">Empate de ${n} equipos con ${p.pts} ${p.pts===1?"punto":"puntos"}. Un vaso por equipo, tira un representante de cada uno y el primero que mete queda arriba.</div></div>`;
  return `<div class="card" style="border-color:var(--amber);margin:4px 0 12px;padding:10px 12px">
    <b style="color:var(--amber)">🎯 Desempate en la mesa</b>
    <div class="hint" style="margin:2px 0 8px">Empate de ${n} equipos con ${p.pts} ${p.pts===1?"punto":"puntos"}. Un vaso por equipo, tira un representante de cada uno: el primero que mete queda arriba. Tocá en orden quién quedó 1°, 2°${n>2?", 3°":""}.</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">${p.ids.map(id=>{ const k = p.partial.indexOf(id);
      return `<div class="tm click ${k>=0?"win":""}" data-dk="${p.dk}" data-id="${id}">${k>=0?(k+1)+"° · ":""}${esc(tname(id))}</div>`; }).join("")}
      ${p.partial.length ? `<button class="btn ghost" data-dkr="${p.dk}" style="padding:8px 12px">Borrar</button>` : ""}</div>
  </div>`;
}
function vGrupos(){
  if (!S.g) return `<div class="empty">Todavía no se armaron los grupos.<br><br>${RO() ? "Cuando se sorteen, aparecen acá solos. 🍺" : `<button class="btn" data-act="sorteo">🎲 Sortear grupos</button><br><br><span class="hint">O armalos a mano en la pestaña Equipos.</span>`}</div>`;
  const thr = allDone() ? thirdsRank() : null, th = thr ? thr.rows : null;
  return `
  ${RO() ? "" : `<div class="bar"><span class="hint">Tocá al equipo que ganó cada partido (1 punto). Tocá de nuevo para deshacer. Si al terminar un grupo empatan 3 equipos, te aparece el desempate para cargar.</span></div>`}
  <div class="groups">
  ${[0,1,2].map(gi=>{
    const ids = groupIds(gi), st = standings(gi);
    return `<div class="card">
      <div class="gtitle">${esc(S.gn[gi])} <small>${st.done ? "✅ terminado" : "en juego"}</small></div>
      <table class="tbl"><colgroup><col style="width:30px"><col><col style="width:34px"><col style="width:34px"><col style="width:34px"><col style="width:40px"></colgroup>
        <tr><th>#</th><th class="tn">Equipo</th><th>PJ</th><th>PG</th><th>PP</th><th>Pts</th></tr>
        ${st.rows.map((r,i)=>{
          const z = i<2 ? "z-oro" : i===2 ? "z-ter" : "z-plata";
          return `<tr class="${z}"><td class="pos">${i+1}</td><td class="tn" title="${esc(S.players[r.id])}">${esc(tname(r.id))}</td><td>${r.pj}</td><td>${r.pg}</td><td>${r.pp}</td><td class="pts">${r.pts}</td></tr>`;
        }).join("")}
      </table>
      ${st.pend.map(p=>pendBox(p, st.done)).join("")}
      ${FECHAS.map((f,fi)=>`<div class="fecha">Fecha ${fi+1}</div>` + f.map(([i,j])=>{
        const a = ids[i], b = ids[j], w = S.r[pkey(a,b)];
        const cl = id => (w===a||w===b) ? (w===id ? "win" : "lose") : "";
        const clk = id => RO() ? "" : `data-res="${pkey(a,b)}" data-id="${id}"`;
        return `<div class="match">
          <div class="tm ${cl(a)} ${RO()?"":"click"}" ${clk(a)} title="${esc(S.players[a])}">${w===a?"✓ ":""}${esc(tname(a))}</div>
          <div class="vs">VS</div>
          <div class="tm r ${cl(b)} ${RO()?"":"click"}" ${clk(b)} title="${esc(S.players[b])}">${esc(tname(b))}${w===b?" ✓":""}</div>
        </div>`;
      }).join("")).join("")}
    </div>`;
  }).join("")}
    <div class="card">
      <div class="gtitle">Mejores terceros <small>${tiesReady() ? "✅ definido" : th ? "falta desempate" : "se define al final"}</small></div>
      <table class="tbl"><colgroup><col style="width:30px"><col><col style="width:44px"><col style="width:40px"></colgroup>
        <tr><th>#</th><th class="tn">Equipo</th><th>Grupo</th><th>Pts</th></tr>
        ${(th || thirdsRank().rows).map((r,i)=>`
          <tr class="${i<2?"z-oro":"z-plata"}"><td class="pos">${i+1}</td><td class="tn">${esc(tname(r.id))}</td><td>${LETTERS[r.gi]}</td><td class="pts">${r.pts}</td></tr>`).join("")}
      </table>
      ${thr ? thr.pend.map(p=>pendBox(p, true)).join("") : ""}
      <div class="hint">Los 2 mejores terceros pasan a cuartos. El peor tercero queda afuera. Si empatan en puntos, se define por sorteo 🎲.</div>
    </div>
  </div>
  <div class="legend">
    <span><i style="background:var(--green)"></i>Pasan a cuartos</span>
    <span><i style="background:var(--amber)"></i>Depende de la tabla de terceros</span>
    <span><i style="background:var(--silver)"></i>Quedan afuera</span>
    <span>PJ jugados · PG ganados · PP perdidos · Pts 1 por victoria</span>
  </div>`;
}

function tie(m){
  const sd = sides(m), w = winner(m), ready = sd.every(s=>s.id!==null), Q = qualified();
  return `<div class="tie"><div class="lbl">${KO[m].lbl}</div>
    ${sd.map(s=>{
      if (s.id===null) return `<div class="slot tbd">${esc(s.label)}</div>`;
      const cls = w===null ? "" : (w===s.id ? "win" : "lose");
      const clk = ready && !RO() ? `data-ko="${m}" data-id="${s.id}"` : "";
      const tag = w===s.id ? "PASA ✓" : (Q && Q.thirdsLbl[s.id] && m[0]==="q" ? Q.thirdsLbl[s.id] : "");
      return `<div class="slot ${cls} ${clk?"click":""}" ${clk} title="${esc(S.players[s.id])}"><span>${esc(tname(s.id))}</span><span class="tag">${tag}</span></div>`;
    }).join("")}</div>`;
}
function champ(m, pl){
  const c = winner(m), icon = pl ? "🥈" : "🏆";
  return c===null ? `<div class="champ ${pl?"pl":""}"><div class="t">${icon}</div><div class="p">A definir</div></div>`
    : `<div class="champ ${pl?"pl":""}"><div class="t">${icon}</div><div class="n">${esc(tname(c))}</div><div class="p">${esc(S.players[c])}</div></div>`;
}
function vLlaves(){
  const col = (h, ms) => `<div class="col"><h3>${h}</h3><div class="ties">${ms.map(tie).join("")}</div></div>`;
  return `
  ${RO() ? "" : `<div class="bar"><span class="hint">Las llaves se completan solas cuando terminan los 3 grupos. Tocá al que ganó y pasa; tocá de nuevo para deshacer.</span></div>`}
  ${allDone() && !tiesReady() ? `<div class="card" style="border-color:var(--amber);margin-bottom:14px">🎯 Falta cargar un desempate en la pestaña Grupos para armar los cuartos.</div>` : ""}
  <div class="sect oro">🏆 Eliminación</div>
  <div class="bracket">
    ${col("Cuartos",["q1","q2","q3","q4"])}${col("Semis",["s1","s2"])}${col("Final",["f"])}
    <div class="col"><h3>Campeón</h3><div class="ties">${champ("f")}</div></div>
  </div>
  ${RO() ? "" : `<div class="bar" style="margin-top:28px"><button class="btn ghost" data-act="reset">Reiniciar torneo</button></div>`}`;
}

function vEquipos(){
  const dis = RO() ? "disabled" : "";
  const teamOpts = sel => Array.from({length:N},(_,id)=>`<option value="${id}" ${id===sel?"selected":""}>${esc(tname(id))}</option>`).join("");
  return `
  ${RO() ? "" : `<div class="bar">
    <button class="btn" data-act="sorteo">🎲 ${S.g ? "Re-sortear grupos" : "Sortear grupos"}</button>
    <span class="hint">Podés sortear o elegir a mano qué equipo va en cada lugar. Si elegís uno que ya estaba en otro lugar, se intercambian.</span></div>`}
  ${S.g ? `<div class="teams" style="margin-bottom:22px">
    ${[0,1,2].map(gi=>`<div class="card">
      <input class="f big" data-gn="${gi}" value="${esc(S.gn[gi])}" maxlength="24" ${dis}>
      ${groupIds(gi).map((id,i)=>`<div class="row"><div class="num">${LETTERS[gi]}${i+1}</div>
        <select class="f" data-slot="${gi*4+i}" ${dis}>${teamOpts(id)}</select></div>`).join("")}
    </div>`).join("")}
  </div>` : ""}
  <div class="teams">
    ${Array.from({length:N},(_,id)=>`<div class="card">
      <div class="num" style="padding:0;color:var(--orange);font-weight:800;font-size:12px;letter-spacing:2px">EQUIPO ${id+1}</div>
      <input class="f big" style="margin:8px 0 6px" data-name="${id}" placeholder="Nombre del equipo" value="${esc(S.names[id])}" maxlength="28" ${dis}>
      ${RO() ? `<div class="players">${esc(S.players[id])}</div>` : `<input class="f" data-pl="${id}" value="${esc(S.players[id])}" maxlength="70">`}
    </div>`).join("")}
  </div>`;
}

function vReglas(){
  return `<div class="rules">
    <div class="card"><h4>Formato</h4>
      <p>• 12 equipos en 3 grupos de 4. Todos contra todos en el grupo: <b>3 partidos cada uno</b>.</p>
      <p>• Pasan a <span class="y">cuartos</span> los 2 primeros de cada grupo y los 2 mejores terceros. Después semis y final.</p>
    </div>
    <div class="card" style="grid-column:1/-1;border-color:var(--orange)"><h4>Cómo se clasifica</h4>
      <p>Partido ganado = <b>1 punto</b> · Partido perdido = <b>0 puntos</b>. Si dos o más equipos terminan igualados, se desempata en este orden:</p>
      <div class="steps">
        <div><span>1</span><p><b>Puntos.</b> Queda arriba el que tiene más puntos.</p></div>
        <div><span>2</span><p><b>Partido entre ellos.</b> Si empatan 2 equipos, queda arriba el que le ganó al otro en el grupo.</p></div>
        <div><span>3</span><p><b>Desempate en la mesa.</b> Si empatan 3 equipos (cada uno le ganó a otro), se pone <span class="y">un vaso por equipo</span> y tira <span class="y">un representante de cada equipo</span>, por turnos. <b>El primero que mete, queda arriba.</b> Los que quedan vuelven a tirar para definir el resto.</p></div>
      </div>
      <p style="margin-top:6px">• <b>Mejores terceros:</b> pasan a cuartos los 2 terceros con más puntos. Si empatan, se define por <span class="y">sorteo</span>.</p>
    </div>
    <div class="card"><h4>Bebidas y equipos</h4>
      <p>• Se juega con 2 cervezas con alcohol por equipo.</p>
      <p>• Una pelota por jugador (equipo de 3, tres pelotas por mesa).</p></div>
    <div class="card"><h4>Dinámica de tiro</h4>
      <p>• Para tirar, el jugador tiene que haber tomado todo el vaso y demostrado que lo tomó todo. Si tira antes, pierde el tiro.</p>
      <p>• Se pueden acomodar los vasos solo 1 vez por equipo, no se pierde el turno.</p></div>
    <div class="card"><h4>Tiros dobles y triples</h4>
      <p>• Si meten 2 jugadores en el mismo vaso equivale a <b>3 vasos</b>.</p>
      <p class="r">• Si meten 3 jugadores en el mismo vaso equivale a partido, sin chance de salvarse.</p>
      <p>• Si meten 3 jugadores en distintos vasos, vuelven las pelotitas y tira de nuevo todo el equipo.</p></div>
    <div class="card"><h4>Pique y rebote</h4>
      <p>• Si un jugador mete una pelota con pique son <b>2 vasos</b>. Cuando la pelota pica, el rival puede redireccionarla.</p>
      <p>• Si la pelota vuelve por la mesa, se tira con la <span class="y">mano inhábil</span>. ¡No existe pechito, estamos en contra!</p></div>
    <div class="card"><h4>Jugadas especiales</h4>
      <p>• <span class="y">ISLA:</span> con un vaso aislado y 3 conectados se puede cantar isla. Si metés en el aislado, el rival toma todos los otros. Si cae en otro vaso, el tiro se anula. Una vez por equipo, y lo juega todo el equipo en esa ronda.</p>
      <p>• <span class="y">TIRO BOBO:</span> si le errás a la mesa, tomás de un vaso general.</p></div>
    <div class="card"><h4>Definición y cierre</h4>
      <p>• <span class="y">RÉPLICA:</span> cuando se acierta el último vaso, el equipo contrario tiene una última chance. Cada jugador tira una vez; si mete, se salva el equipo y sigue el partido.</p>
      <p>• El equipo perdedor se toma los vasos restantes del equipo ganador.</p></div>
  </div>`;
}

// ===== guardar y publicar =====
let lastT = 0, liveState = "", pubTimer = null;
const hhmm = t => new Date(t).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
function save(){
  if (!isAdmin) return;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  if (LIVE){ clearTimeout(pubTimer); pubTimer = setTimeout(publish, 400); }
}
function pack(){ return JSON.stringify({v:3, t:Date.now(), n:S.names, p:S.players, gn:S.gn, g:S.g, r:S.r, k:S.k, d:S.d, tb:S.tb}); }
function unpack(str){
  let d; try { d = JSON.parse(str); } catch(e){ return null; }
  if (!d || d.v!==3 || typeof d.t!=="number") return null;
  const strArr = (a,len,max) => Array.isArray(a) && a.length===len && a.every(x=>typeof x==="string" && x.length<=max);
  if (!strArr(d.n,N,28) || !strArr(d.p,N,70) || !strArr(d.gn,3,24)) return null;
  if (d.g!==null && !(Array.isArray(d.g) && d.g.length===N && d.g.every(okId) && new Set(d.g).size===N)) return null;
  if (!Array.isArray(d.tb) || d.tb.length!==N || !d.tb.every(x=>typeof x==="number")) return null;
  const r = {}, k = {};
  if (d.r && typeof d.r==="object") for (const [key,val] of Object.entries(d.r)) if (/^\d{1,2}-\d{1,2}$/.test(key) && okId(val)) r[key]=val;
  if (d.k && typeof d.k==="object") for (const [key,val] of Object.entries(d.k)) if (KO[key] && okId(val)) k[key]=val;
  const dd = {};
  if (d.d && typeof d.d==="object") for (const [key,val] of Object.entries(d.d)) if (/^(g[0-2]|t):\d$/.test(key) && Array.isArray(val) && val.length<=4 && val.every(okId) && new Set(val).size===val.length) dd[key]=val;
  return { t:d.t, names:d.n, players:d.p, gn:d.gn, g:d.g, r, k, d:dd, tb:d.tb };
}
function apply(d){
  lastT = d.t;
  S = { names:d.names, players:d.players, gn:d.gn, g:d.g, r:d.r, k:d.k, d:d.d, tb:d.tb };
  liveState = "Última actualización: " + hhmm(d.t);
  banner(); render();
}
async function publish(){
  try {
    const res = await fetch(NTFY, {method:"POST", body: pack()});
    liveState = res.ok ? "✅ Publicado " + hhmm(Date.now()) : "⚠️ No se pudo publicar (" + res.status + "). Tocá de nuevo en un rato.";
  } catch(e){ liveState = "⚠️ Sin conexión: el cambio quedó en tu celular y se publica en el próximo cambio."; }
  banner();
}
async function pollLatest(){
  try {
    const txt = await (await fetch(NTFY + "/json?poll=1&since=12h")).text();
    let best = null;
    for (const line of txt.split("\n")){
      if (!line.trim()) continue;
      let o; try { o = JSON.parse(line); } catch(e){ continue; }
      if (o.event!=="message") continue;
      const d = unpack(o.message);
      if (d && (!best || d.t > best.t)) best = d;
    }
    if (best && best.t > lastT) apply(best);
    else if (!best && !lastT){ liveState = "Esperando que arranque el torneo…"; banner(); }
  } catch(e){ liveState = "⚠️ No se pudo conectar. Reintentando…"; banner(); }
}
function follow(){
  pollLatest();
  try {
    const es = new EventSource(NTFY + "/sse");
    es.onmessage = e => { let o; try { o = JSON.parse(e.data); } catch(err){ return; } if (o.event==="message"){ const d = unpack(o.message); if (d && d.t > lastT) apply(d); } };
    es.onopen = () => pollLatest();
  } catch(e){}
  setInterval(pollLatest, 60000);
  document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) pollLatest(); });
}
function banner(){
  const b = document.getElementById("live");
  if (!LIVE){ b.style.display = "none"; return; }
  b.style.display = "block";
  b.innerHTML = (isAdmin ? "<b>🔴 EN VIVO</b> · Vos cargás, todos lo ven." : "<b>🔴 EN VIVO</b> · Se actualiza solo.") + (liveState ? " " + esc(liveState) : "");
}

// ===== acciones =====
function confirmBox(msg, ok){
  const m = document.getElementById("modal");
  m.innerHTML = `<div class="modal"><div class="box"><p>${msg}</p>
    <div class="bar" style="margin:0;justify-content:flex-end"><button class="btn ghost" id="mNo">Cancelar</button><button class="btn" id="mYes">Sí, dale</button></div></div></div>`;
  document.getElementById("mNo").onclick = ()=> m.innerHTML="";
  document.getElementById("mYes").onclick = ()=>{ m.innerHTML=""; ok(); };
}
function doSorteo(){
  const ids = Array.from({length:N},(_,i)=>i);
  for (let i=N-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]; }
  S.g = ids; S.r = {}; S.k = {}; S.d = {}; S.tb = randTb();
  save(); go("grupos");
}
function go(v){ view = v; try{ history.replaceState(null,"","#"+v); }catch(e){} render(); window.scrollTo(0,0); }
const hasResults = () => Object.keys(S.r).length || Object.keys(S.k).length;

document.getElementById("nav").addEventListener("click", e=>{
  const b = e.target.closest("button[data-v]"); if (b) go(b.dataset.v);
});
document.getElementById("app").addEventListener("click", e=>{
  if (RO()) return;
  const a = e.target.closest("[data-act]");
  if (a){
    if (a.dataset.act==="sorteo"){ if (S.g && hasResults()) confirmBox("Re-sortear borra todos los resultados. ¿Seguro?", doSorteo); else doSorteo(); }
    if (a.dataset.act==="reset") confirmBox("Esto borra grupos y resultados (nombres y jugadores quedan). ¿Seguro?", ()=>{ S.g=null; S.r={}; S.k={}; S.d={}; save(); go("equipos"); });
    return;
  }
  const dk = e.target.closest("[data-dk]");
  if (dk){ const key = dk.dataset.dk, id = +dk.dataset.id; S.d = S.d || {}; const cur = (S.d[key]||[]).slice(); if (!cur.includes(id)) cur.push(id); S.d[key] = cur; save(); render(); return; }
  const dr = e.target.closest("[data-dkr]");
  if (dr){ S.d = S.d || {}; delete S.d[dr.dataset.dkr]; save(); render(); return; }
  const r = e.target.closest("[data-res]");
  if (r){ const key = r.dataset.res, id = +r.dataset.id; if (S.r[key]===id) delete S.r[key]; else S.r[key]=id; save(); render(); return; }
  const k = e.target.closest("[data-ko]");
  if (k){ const m = k.dataset.ko, id = +k.dataset.id; if (winner(m)===id) delete S.k[m]; else S.k[m]=id; save(); render(); }
});
document.getElementById("app").addEventListener("change", e=>{
  if (RO()) return;
  const t = e.target;
  if (t.dataset.name!==undefined){ S.names[+t.dataset.name] = t.value.slice(0,28); save(); render(); return; }
  if (t.dataset.pl!==undefined){ S.players[+t.dataset.pl] = t.value.slice(0,70); save(); return; }
  if (t.dataset.gn!==undefined){ S.gn[+t.dataset.gn] = t.value.slice(0,24) || ("Grupo " + LETTERS[+t.dataset.gn]); save(); render(); return; }
  if (t.dataset.slot!==undefined){
    const slot = +t.dataset.slot, id = +t.value, other = S.g.indexOf(id);
    if (other!==-1 && other!==slot){ S.g[other] = S.g[slot]; }
    S.g[slot] = id; save(); render();
  }
});
window.addEventListener("hashchange", ()=>{ const h = location.hash.slice(1); if (VIEWS.includes(h)){ view = h; render(); } });

if (LIVE && isAdmin){
  const b = document.createElement("button"); b.className = "adminbtn"; b.textContent = "🔑 Organizador · Salir";
  b.onclick = ()=> confirmBox("¿Salir del modo organizador en este celular? Vas a ver la página como la gente. Para volver, abrí de nuevo tu link secreto.", ()=>{
    try{ localStorage.removeItem(KEY + "-admin"); }catch(e){} location.hash = "grupos"; location.reload(); });
  document.getElementById("nav").appendChild(b);
}
render(); banner();
if (LIVE){ if (isAdmin){ if (S.g) publish(); } else follow(); }
</script>
