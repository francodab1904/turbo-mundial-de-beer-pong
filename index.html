<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:description" content="Messi Cup · Champions League. 13 equipos, eliminación directa, reglas oficiales. Ganen o mueran.">
<meta property="og:image" content="https://francodab1904.github.io/turbo-mundial-de-beer-pong/preview.png">

<meta property="og:image:height" content="630">

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111216; --panel:#17181e; --panel2:#1f2129; --line:#2c2e38;
    --text:#f2f2f4; --muted:#9a9cab; --orange:#ff7a1a; --gold:#ffcf5c; --green:#2fd27a; --red:#ff4d5e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;border-right:6px solid #e0202a}
  header{padding:28px 20px 6px;max-width:1300px;margin:0 auto}
  .pill{display:inline-block;background:var(--orange);color:#1b0d00;font-weight:800;letter-spacing:3px;font-size:12px;padding:6px 12px;border-radius:6px}
  .pill + span{color:var(--muted);font-weight:600;font-size:14px;margin-left:8px}
  h1{font-family:Anton,sans-serif;font-weight:400;color:var(--orange);font-size:clamp(34px,8vw,72px);margin:10px 0 0;line-height:1;text-transform:uppercase}
  h2.sub{font-family:Anton,sans-serif;font-weight:400;font-size:clamp(20px,4.5vw,40px);margin:4px 0 0;text-transform:uppercase}
  h2.sub i{color:#e0202a;font-style:normal}
  nav{display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px;position:sticky;top:0;background:rgba(17,18,22,.92);backdrop-filter:blur(8px);z-index:5;max-width:1300px;margin:0 auto}
  nav button{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:10px 18px;border-radius:999px;font-weight:700;cursor:pointer;font-size:14px}
  nav button.on{background:var(--orange);color:#1b0d00;border-color:var(--orange)}
  main{max-width:1300px;margin:0 auto;padding:6px 20px 60px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 18px}
  .btn{background:var(--orange);color:#1b0d00;border:0;padding:11px 18px;border-radius:10px;font-weight:800;cursor:pointer;font-size:14px}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .hint{color:var(--muted);font-size:13px}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .team-card .num{color:var(--orange);font-weight:800;font-size:12px;letter-spacing:2px}
  .team-card input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 10px;border-radius:8px;font-weight:700;font-size:15px;margin:8px 0 6px}
  .players{color:var(--muted);font-size:13px}

  .bracket{display:grid;grid-template-columns:repeat(5,minmax(185px,1fr));gap:16px;overflow-x:auto;padding-bottom:12px}
  .col{display:flex;flex-direction:column;justify-content:space-around;gap:12px;min-width:185px}
  .col h3{font-family:Anton,sans-serif;font-weight:400;text-align:center;margin:0 0 4px;color:var(--orange);letter-spacing:1px;font-size:19px;text-transform:uppercase}
  .tie{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .tie .lbl{font-size:10px;color:var(--muted);padding:6px 10px 2px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700}
  .slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;cursor:pointer;font-weight:700;font-size:14px;border-top:1px solid var(--line);transition:background .15s}
  .slot:first-of-type{border-top:0}
  .slot:hover{background:var(--panel2)}
  .slot span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .slot.tbd,.slot.bye{color:var(--muted);font-weight:500;font-style:italic;cursor:default}
  .slot.tbd:hover,.slot.bye:hover{background:transparent}
  .slot.win{background:rgba(47,210,122,.15);color:var(--green)}
  .slot.lose{color:var(--muted);text-decoration:line-through;opacity:.55}
  .slot .tag{font-size:10px;font-weight:800;color:var(--green);flex-shrink:0}
  .tie.directo{border-style:dashed}
  .champ{text-align:center;padding:24px 14px;border:2px solid var(--gold);border-radius:16px;background:linear-gradient(180deg,rgba(255,207,92,.16),transparent)}
  .champ .t{font-size:52px}
  .champ .n{font-family:Anton,sans-serif;font-size:28px;color:var(--gold);text-transform:uppercase;line-height:1.1}
  .champ .p{color:var(--muted);font-size:13px;margin-top:6px}

  .rules{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .rules h4{margin:0 0 12px;padding-bottom:12px;border-bottom:1px solid var(--line);color:var(--orange);letter-spacing:2px;font-size:15px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
  .rules h4::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--orange)}
  .rules p{margin:0 0 12px;line-height:1.5;font-size:15px}
  .rules b{color:#fff}
  .rules .y{color:var(--gold);font-weight:800}
  .rules .r{color:var(--red);font-weight:800}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:380px;width:100%}
  .modal .box p{margin:0 0 16px;line-height:1.5}
  .empty{text-align:center;padding:40px 16px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <span class="pill">REGLAS OFICIALES</span><span>(Anti viejos gaga · Ganen o Mueran)</span>
  <h1>Turbo Mundial de Beer Pong</h1>
  <h2 class="sub">Messi Cup <i>·</i> Champions League</h2>
</header>
<nav id="nav">
  <button data-v="cuadro">🏆 Cuadro</button>
  <button data-v="equipos">Equipos</button>
  <button data-v="reglas">Reglas</button>
</nav>
<div id="live" style="display:none;max-width:1260px;margin:0 auto 10px;padding:10px 14px;border:1px solid #e0202a;border-radius:10px;background:rgba(224,32,42,.12);font-size:14px;width:calc(100% - 40px)"></div>
<main id="app"></main>
<div id="modal"></div>

<script>
const PLAYERS = [
  "Ivan / Brunito / Salvu",
  "Tito / Francesca Giacomi / Luis",
  "Franco Gonzalez / Gonza I / Ema Sanchez",
  "Juanita / Mauro / Tino",
  "Botacchi / Massi / Benja Leanes",
  "Florian / Pollo / Justo Echevarria",
  "Marini / Pipe Juarez / Luli Da Cuna",
  "Juli Gariboti / Tano / Agus Hernandez",
  "Gero Vacca / Tomas Moavro / Santi Gonzalez",
  "Cento / Marcos / Pedro Guastavino",
  "Bocha / Ampi / Tincho",
  "Toto Costa / Justo Guastavino / Santi Mora",
  "Salva / Dogui / Cala"
];
const KEY = "turbo-mundial-bp-elim-v2";
const ROUNDS = ["Octavos","Cuartos","Semis","Final"];
const REP = "R"; // lugar del repechaje en el cuadro
// Cuadro de 16: un equipo sorteado pasa directo (octavos 1), 12 equipos juegan octavos 2–7,
// y octavos 8 lo ocupa un perdedor sorteado (repechaje), en la otra mitad del cuadro.

function fresh(){
  let names = {};
  for (const k of ["turbo-mundial-bp-elim-v1","turbo-mundial-bp-v1"]){
    try { const old = JSON.parse(localStorage.getItem(k)); if (old) old.teams.forEach(t=>{ if(!names[t.id]) names[t.id]=t.name; }); } catch(e){}
  }
  return { teams: PLAYERS.map((p,i)=>({id:i, name:names[i]||"", players:p})), slots:null, ko:{}, rep:null };
}
// ---------- organizador: se activa una vez abriendo el link secreto (#admin-...) ----------
const ADMIN_CODE = "admin-mc7k2q";
const VIEWS = ["cuadro","equipos","reglas"];
let isAdmin = false;
try { isAdmin = localStorage.getItem(KEY + "-admin") === "1"; } catch(e){}
if (location.hash.slice(1) === ADMIN_CODE){
  isAdmin = true;
  try { localStorage.setItem(KEY + "-admin", "1"); } catch(e){}
  try { history.replaceState(null, "", "#cuadro"); } catch(e){ location.hash = "cuadro"; }
}
if (location.hash.slice(1) === "salir"){
  isAdmin = false;
  try { localStorage.removeItem(KEY + "-admin"); } catch(e){}
  try { history.replaceState(null, "", "#cuadro"); } catch(e){}
}
let S;
if (isAdmin){ try { S = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch(e){ S = fresh(); } }
else S = fresh();
let view = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : (isAdmin ? (S.slots ? "cuadro" : "equipos") : "cuadro");
// ---------- modo: local (organizador), viewer (solo mira) ----------
let mode = isAdmin ? "local" : "viewer";
const RO = () => mode === "viewer";

// ---------- en vivo: el organizador publica cada cambio en un canal de ntfy.sh y los demás lo escuchan ----------
const NTFY = "https://ntfy.sh/turbo-mundial-bp-q7x3m9k2w5";
let lastT = 0, liveState = "", pubTimer = null;
const hhmm = t => new Date(t).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});

function save(){
  if (mode !== "local") return;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  clearTimeout(pubTimer); pubTimer = setTimeout(publish, 400);
}
function pack(){
  return JSON.stringify({v:1, t:Date.now(), n:S.teams.map(t=>t.name), s:S.slots, k:S.ko, r:S.rep});
}
function unpack(str){
  let d; try { d = JSON.parse(str); } catch(e){ return null; }
  if (!d || d.v!==1 || typeof d.t!=="number" || !Array.isArray(d.n) || d.n.length!==PLAYERS.length) return null;
  const okId = x => Number.isInteger(x) && x>=0 && x<PLAYERS.length;
  if (d.s!==null && !(Array.isArray(d.s) && d.s.length===16 && d.s.every(x=>x===null||x===REP||okId(x)))) return null;
  if (typeof d.k!=="object" || d.k===null) return null;
  const k = {};
  for (const [key,val] of Object.entries(d.k)) if (/^r[0-3]m[0-7]$/.test(key) && (val===null||okId(val))) k[key]=val;
  return { t:d.t, names:d.n.map(x=>String(x||"").slice(0,28)), slots:d.s, ko:k, rep: okId(d.r)?d.r:null };
}
function apply(d){
  lastT = d.t;
  S = { teams: PLAYERS.map((p,i)=>({id:i, name:d.names[i], players:p})), slots:d.slots, ko:d.ko, rep:d.rep };
  liveState = "Última actualización: " + hhmm(d.t);
  banner(); render();
}
async function publish(){
  try {
    const r = await fetch(NTFY, {method:"POST", body: pack()});
    liveState = r.ok ? "✅ Publicado " + hhmm(Date.now()) : "⚠️ No se pudo publicar (" + r.status + "). Tocá de nuevo en un rato.";
  } catch(e){ liveState = "⚠️ Sin conexión: el cambio quedó guardado en tu celular, se publica en el próximo cambio."; }
  banner();
}
async function pollLatest(){
  try {
    const r = await fetch(NTFY + "/json?poll=1&since=12h");
    const txt = await r.text();
    let best = null;
    for (const line of txt.split("\n")){
      if (!line.trim()) continue;
      let o; try { o = JSON.parse(line); } catch(e){ continue; }
      if (o.event!=="message") continue;
      const d = unpack(o.message);
      if (d && (!best || d.t > best.t)) best = d;
    }
    if (best && best.t > lastT) apply(best);
    else if (!best && !lastT){ liveState = "Esperando que arranque el torneo…"; banner(); }
  } catch(e){ liveState = "⚠️ No se pudo conectar. Reintentando…"; banner(); }
}
function follow(){
  pollLatest();
  try {
    const es = new EventSource(NTFY + "/sse");
    es.onmessage = e => {
      let o; try { o = JSON.parse(e.data); } catch(err){ return; }
      if (o.event!=="message") return;
      const d = unpack(o.message);
      if (d && d.t > lastT) apply(d);
    };
    es.onopen = () => pollLatest();      // al reconectar, ponerse al día
  } catch(e){}
  setInterval(pollLatest, 60000);         // red de seguridad
  document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) pollLatest(); });
}
function banner(){
  const b = document.getElementById("live");
  if (!b) return;
  b.style.display = "block";
  b.innerHTML = (isAdmin ? "<b>🔴 EN VIVO</b> · Vos cargás, todos lo ven." : "<b>🔴 EN VIVO</b> · El cuadro se actualiza solo.") + (liveState ? " " + esc(liveState) : "");
}

const T = id => S.teams[id];
const tname = id => (T(id).name.trim() || ("Equipo " + (id+1)));
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mid = (r,m) => "r"+r+"m"+m;

// sides: array of {id, bye, label}
function sides(r,m){
  if (r===0){
    if (!S.slots) return [{id:null,label:"A sortear"},{id:null,label:"A sortear"}];
    return [S.slots[2*m], S.slots[2*m+1]].map(id =>
      id===null ? {id:null,bye:true,label:"Pasa directo"}
      : id===REP ? {id:repTeam(), rep:true, label:"Repechaje"}
      : {id,label:""});
  }
  return [2*m, 2*m+1].map(pm => ({id:winner(r-1,pm), label:"Ganador "+ROUNDS[r-1]+" "+(pm+1)}));
}
// perdedores de los octavos que se juegan (null si falta algún resultado)
function octLosers(){
  const out = [];
  for (let m=0;m<8;m++){
    const sd = [S.slots[2*m], S.slots[2*m+1]];
    if (sd.includes(null) || sd.includes(REP)) continue;
    const w = S.ko[mid(0,m)];
    if (w===undefined || w===null || !sd.includes(w)) return null;
    out.push(sd[0]===w ? sd[1] : sd[0]);
  }
  return out;
}
function repTeam(){
  if (S.rep===null || S.rep===undefined) return null;
  const l = octLosers();
  return l && l.includes(S.rep) ? S.rep : null;
}
function winner(r,m){
  const sd = sides(r,m);
  if (r===0 && S.slots){
    if (sd[1].bye) return sd[0].id;
    if (sd[0].bye) return sd[1].id;
  }
  const w = S.ko[mid(r,m)];
  if (w===undefined || w===null) return null;
  return sd.some(s=>s.id===w) ? w : null;
}

function render(){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on", b.dataset.v===view));
  const app = document.getElementById("app");
  app.innerHTML = view==="equipos" ? vEquipos() : view==="reglas" ? vReglas() : vCuadro();
}

function vEquipos(){
  return `
  <div class="bar">
    ${RO() ? "" : `<button class="btn" data-act="sorteo">🎲 ${S.slots ? "Re-sortear cuadro" : "Sortear cuadro"}</button>`}
    <span class="hint">Nombre de equipo opcional. El sorteo arma el cuadro: un equipo sorteado pasa directo a cuartos, los otros 12 juegan 6 partidos de octavos y entre los 6 perdedores se sortea uno que vuelve por repechaje.</span>
  </div>
  <div class="grid">
    ${S.teams.map(t=>`
      <div class="card team-card">
        <div class="num">EQUIPO ${t.id+1}</div>
        <input data-name="${t.id}" placeholder="Nombre del equipo" value="${esc(t.name)}" maxlength="28" ${RO()?"disabled":""}>
        <div class="players">${esc(t.players)}</div>
      </div>`).join("")}
  </div>`;
}

function tie(r,m){
  const sd = sides(r,m), w = winner(r,m);
  const isBye = r===0 && sd.some(s=>s.bye);
  const ready = sd.every(s=>s.id!==null);
  const label = r===3 ? "Final" : ROUNDS[r]+" "+(m+1);
  return `<div class="tie ${isBye?'directo':''}"><div class="lbl">${label}</div>
    ${sd.map(s=>{
      if (s.bye) return `<div class="slot bye">— pasa directo —</div>`;
      if (s.rep && s.id===null){
        return octLosers() && !RO()
          ? `<div class="slot tbd" style="cursor:default"><button class="btn" data-act="rep" style="width:100%">🎲 Sortear repechaje</button></div>`
          : `<div class="slot tbd">Repechaje: se sortea entre los perdedores de octavos</div>`;
      }
      if (s.rep) return `<div class="slot win" title="${esc(T(s.id).players)}"><span>${esc(tname(s.id))}</span><span class="tag">REPECHAJE</span></div>`;
      if (s.id===null) return `<div class="slot tbd">${esc(s.label)}</div>`;
      const cls = isBye ? "win" : (w===null ? "" : (w===s.id ? "win" : "lose"));
      const click = ready && !isBye && !RO() ?`data-r="${r}" data-m="${m}" data-id="${s.id}"` : "";
      const tag = isBye ? "DIRECTO 🎲" :(w===s.id ? "PASA ✓" : "");
      return `<div class="slot ${cls}" ${click} title="${esc(T(s.id).players)}"><span>${esc(tname(s.id))}</span><span class="tag">${tag}</span></div>`;
    }).join("")}
  </div>`;
}

function vCuadro(){
  if (!S.slots) return `<div class="empty">Todavía no se sorteó el cuadro.<br><br>${RO() ? "Cuando se sortee, aparece acá solo. 🍺" : `<button class="btn" data-act="sorteo">🎲 Sortear cuadro</button>`}</div>`;
  const champ = winner(3,0);
  const col = (r,n) => `<div class="col"><h3>${ROUNDS[r]}</h3>${Array.from({length:n},(_,m)=>tie(r,m)).join("")}</div>`;
  return `
  ${RO() ? "" : `<div class="bar"><span class="hint">Tocá al equipo que ganó y pasa a la siguiente ronda. Tocá de nuevo para deshacer. Cuando terminan los 6 octavos aparece el botón para sortear el repechaje entre los perdedores.</span></div>`}
  <div class="bracket">
    ${col(0,8)}${col(1,4)}${col(2,2)}${col(3,1)}
    <div class="col"><h3>Campeón</h3>
      ${champ===null ? `<div class="champ"><div class="t">🏆</div><div class="p">A definir</div></div>`
        : `<div class="champ"><div class="t">🏆</div><div class="n">${esc(tname(champ))}</div><div class="p">${esc(T(champ).players)}</div></div>`}
    </div>
  </div>
  ${RO() ? "" : `<div class="bar" style="margin-top:28px"><button class="btn ghost" data-act="reset">Reiniciar torneo</button></div>`}`;
}

function vReglas(){
  return `<div class="rules">
    <div class="card"><h4>Bebidas y equipos</h4>
      <p>• Se juega con 2 cervezas con alcohol por equipo.</p>
      <p>• Una pelota por jugador (equipo de 3, tres pelotas por mesa).</p></div>
    <div class="card"><h4>Dinámica de tiro</h4>
      <p>• Para tirar, el jugador tiene que haber tomado todo el vaso y demostrado que lo tomó todo. Si tira antes, pierde el tiro.</p>
      <p>• Se pueden acomodar los vasos solo 1 vez por equipo, no se pierde el turno.</p></div>
    <div class="card"><h4>Tiros dobles y triples</h4>
      <p>• Si meten 2 jugadores en el mismo vaso equivale a <b>3 vasos</b>.</p>
      <p class="r">• Si meten 3 jugadores en el mismo vaso equivale a partido, sin chance de salvarse.</p>
      <p>• Si meten 3 jugadores en distintos vasos, vuelven las pelotitas y tira de nuevo todo el equipo.</p></div>
    <div class="card"><h4>Pique y rebote</h4>
      <p>• Si un jugador mete una pelota con pique son <b>2 vasos</b>. Cuando la pelota pica, el rival puede redireccionarla.</p>
      <p>• Si la pelota vuelve por la mesa, se tira con la <span class="y">mano inhábil</span>. ¡No existe pechito, estamos en contra!</p></div>
    <div class="card"><h4>Jugadas especiales</h4>
      <p>• <span class="y">ISLA:</span> con un vaso aislado y 3 conectados se puede cantar isla. Si metés en el aislado, el rival toma todos los otros. Si cae en otro vaso, el tiro se anula. Una vez por equipo, y lo juega todo el equipo en esa ronda.</p>
      <p>• <span class="y">TIRO BOBO:</span> si le errás a la mesa, tomás de un vaso general.</p></div>
    <div class="card"><h4>Definición y cierre</h4>
      <p>• <span class="y">RÉPLICA:</span> cuando se acierta el último vaso, el equipo contrario tiene una última chance. Cada jugador tira una vez; si mete, se salva el equipo y sigue el partido.</p>
      <p>• El equipo perdedor se toma los vasos restantes del equipo ganador.</p></div>
  </div>`;
}

function confirmBox(msg, ok){
  const m = document.getElementById("modal");
  m.innerHTML = `<div class="modal"><div class="box"><p>${msg}</p>
    <div class="bar" style="margin:0;justify-content:flex-end">
      <button class="btn ghost" id="mNo">Cancelar</button><button class="btn" id="mYes">Sí, dale</button></div></div></div>`;
  document.getElementById("mNo").onclick = ()=> m.innerHTML="";
  document.getElementById("mYes").onclick = ()=>{ m.innerHTML=""; ok(); };
}
function doSorteo(){
  const ids = S.teams.map(t=>t.id);
  for (let i=ids.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]; }
  // el primero sorteado pasa directo a cuartos
  S.slots = [ids[0], null, ...ids.slice(1), REP, null];
  S.ko = {}; S.rep = null;
  save(); go("cuadro");
}
function go(v){ view=v; try{ history.replaceState(null,"","#"+v); }catch(e){} render(); window.scrollTo(0,0); }

document.getElementById("nav").addEventListener("click", e=>{
  const b = e.target.closest("button[data-v]"); if (b) go(b.dataset.v);
});
document.getElementById("app").addEventListener("click", e=>{
  if (RO()) return;
  const a = e.target.closest("[data-act]");
  if (a){
    if (a.dataset.act==="sorteo"){
      if (S.slots && Object.values(S.ko).some(v=>v!==null)) confirmBox("Re-sortear borra todos los resultados cargados. ¿Seguro?", doSorteo);
      else doSorteo();
    }
    if (a.dataset.act==="reset") confirmBox("Esto borra el cuadro y los resultados (los nombres de equipo quedan). ¿Seguro?", ()=>{
      S.slots=null; S.ko={}; S.rep=null; save(); go("equipos");
    });
    if (a.dataset.act==="rep"){
      const l = octLosers();
      if (l && l.length){ S.rep = l[Math.floor(Math.random()*l.length)]; save(); render(); }
    }
    return;
  }
  const s = e.target.closest("[data-r]");
  if (s){
    const r=+s.dataset.r, m=+s.dataset.m, id=+s.dataset.id;
    S.ko[mid(r,m)] = (winner(r,m)===id) ? null : id;
    save(); render();
  }
});
document.getElementById("app").addEventListener("change", e=>{
  const t = e.target;
  if (RO()) return;
  if (t.dataset.name!==undefined){ S.teams[+t.dataset.name].name = t.value; save(); }
});
window.addEventListener("hashchange", ()=>{ const h=location.hash.slice(1); if(VIEWS.includes(h)){ view=h; render(); }});
if (isAdmin){
  const b=document.createElement("button"); b.textContent="🔑 Modo organizador · Salir";
  b.style.cssText="margin-left:auto;background:transparent;border:1px solid #ffcf5c;color:#ffcf5c;font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px;cursor:pointer";
  b.onclick=()=>confirmBox("¿Salir del modo organizador en este celular? Vas a ver la página como la gente. Para volver, abrí de nuevo tu link secreto.", ()=>{
    try{ localStorage.removeItem(KEY + "-admin"); }catch(e){}
    location.hash = "cuadro"; location.reload();
  });
  document.getElementById("nav").appendChild(b);
}
render();
banner();
if (isAdmin) { if (S.slots) publish(); } else follow();
</script>
</body>
</html>
