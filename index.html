<style>
  :root{--bg:#111216;--panel:#17181e;--panel2:#1f2129;--line:#2c2e38;--text:#f2f2f4;--muted:#9a9cab;--orange:#ff7a1a;--gold:#ffcf5c;--silver:#c9ced8;--green:#2fd27a;--red:#ff4d5e;--amber:#ffb020}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;border-right:6px solid #e0202a}
  header{padding:26px 20px 4px;max-width:1300px;margin:0 auto}
  .pill{display:inline-block;background:var(--orange);color:#1b0d00;font-weight:800;letter-spacing:3px;font-size:12px;padding:6px 12px;border-radius:6px}
  .pill + span{color:var(--muted);font-weight:600;font-size:14px;margin-left:8px}
  h1{font-family:Anton,sans-serif;font-weight:400;color:var(--orange);font-size:clamp(34px,8vw,72px);margin:10px 0 0;line-height:1;text-transform:uppercase}
  h2.sub{font-family:Anton,sans-serif;font-weight:400;font-size:clamp(20px,4.5vw,40px);margin:4px 0 0;text-transform:uppercase}
  h2.sub i{color:#e0202a;font-style:normal}
  nav{display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px;position:sticky;top:0;background:rgba(17,18,22,.92);backdrop-filter:blur(8px);z-index:5;max-width:1300px;margin:0 auto}
  nav button{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-weight:700;cursor:pointer;font-size:14px}
  nav button.on{background:var(--orange);color:#1b0d00;border-color:var(--orange)}
  #live{display:none;max-width:1260px;margin:0 auto 10px;padding:10px 14px;border:1px solid #e0202a;border-radius:10px;background:rgba(224,32,42,.12);font-size:14px;width:calc(100% - 40px)}
  main{max-width:1300px;margin:0 auto;padding:6px 20px 60px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 18px}
  .btn{background:var(--orange);color:#1b0d00;border:0;padding:11px 18px;border-radius:10px;font-weight:800;cursor:pointer;font-size:14px}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .hint{color:var(--muted);font-size:13px;line-height:1.5}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .groups{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
  .gtitle{font-family:Anton,sans-serif;font-weight:400;font-size:24px;letter-spacing:1px;text-transform:uppercase;color:var(--orange);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .gtitle small{font-family:Inter;font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0}
  table.tbl{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:13px;table-layout:fixed}
  .tbl th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;padding:5px 2px;text-align:center;border-bottom:1px solid var(--line)}
  .tbl td{padding:8px 2px;text-align:center;border-bottom:1px solid var(--line)}
  .tbl tr:last-child td{border-bottom:0}
  .tbl td.tn,.tbl th.tn{text-align:left;padding-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
  .tbl td.pos{border-left:4px solid transparent;font-weight:700}
  .tbl tr.z-oro td.pos{border-left-color:var(--green)}
  .tbl tr.z-ter td.pos{border-left-color:var(--amber)}
  .tbl tr.z-plata td.pos{border-left-color:var(--silver)}
  .tbl td.pts{font-weight:800;font-size:15px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:14px 0 4px}
  .legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
  .fecha{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;font-weight:700;margin:12px 0 4px}
  .match{display:grid;grid-template-columns:1fr 28px 1fr;gap:6px;align-items:center;margin:4px 0}
  .tm{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
  .tm.r{text-align:right}
  .tm.click{cursor:pointer}
  .tm.click:hover{border-color:var(--orange)}
  .tm.win{background:rgba(47,210,122,.16);border-color:var(--green);color:var(--green)}
  .tm.lose{color:var(--muted);opacity:.55;text-decoration:line-through}
  .vs{text-align:center;color:var(--muted);font-size:11px;font-weight:700}
  .bracket{display:grid;grid-template-columns:repeat(4,minmax(185px,1fr));gap:16px;overflow-x:auto;padding-bottom:12px}
  .col{display:grid;grid-template-rows:auto 1fr;gap:8px;min-width:185px}
  .col h3{font-family:Anton,sans-serif;font-weight:400;text-align:center;margin:0;color:var(--orange);letter-spacing:1px;font-size:19px;text-transform:uppercase}
  .col .ties{display:flex;flex-direction:column;justify-content:space-around;gap:12px}
  .plata .col h3{color:var(--silver)}
  .tie{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .tie .lbl{font-size:10px;color:var(--muted);padding:6px 10px 2px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700}
  .slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;font-weight:700;font-size:14px;border-top:1px solid var(--line)}
  .slot:first-of-type{border-top:0}
  .slot.click{cursor:pointer}
  .slot.click:hover{background:var(--panel2)}
  .slot span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .slot.tbd{color:var(--muted);font-weight:500;font-style:italic}
  .slot.win{background:rgba(47,210,122,.15);color:var(--green)}
  .slot.lose{color:var(--muted);text-decoration:line-through;opacity:.55}
  .slot .tag{font-size:10px;font-weight:800;color:var(--green);flex-shrink:0}
  .champ{text-align:center;padding:24px 14px;border:2px solid var(--gold);border-radius:16px;background:linear-gradient(180deg,rgba(255,207,92,.16),transparent)}
  .champ.pl{border-color:var(--silver);background:linear-gradient(180deg,rgba(201,206,216,.14),transparent)}
  .champ .t{font-size:50px}
  .champ .n{font-family:Anton,sans-serif;font-size:26px;color:var(--gold);text-transform:uppercase;line-height:1.1}
  .champ.pl .n{color:var(--silver)}
  .champ .p{color:var(--muted);font-size:13px;margin-top:6px}
  .sect{font-family:Anton,sans-serif;font-weight:400;font-size:30px;text-transform:uppercase;margin:6px 0 10px}
  .sect.oro{color:var(--gold)} .sect.pl{color:var(--silver)}
  .teams{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .teams .row{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;margin:10px 0}
  .teams .num{font-weight:800;color:var(--orange);padding-top:9px;font-size:13px}
  input.f,select.f{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:8px;font-size:14px;font-family:inherit}
  input.f.big{font-weight:800}
  input.f:disabled,select.f:disabled{opacity:1;color:var(--text);-webkit-text-fill-color:var(--text)}
  .players{color:var(--muted);font-size:13px;margin-top:4px}
  .rules{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .rules h4{margin:0 0 12px;padding-bottom:12px;border-bottom:1px solid var(--line);color:var(--orange);letter-spacing:2px;font-size:15px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
  .rules h4::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--orange)}
  .rules p{margin:0 0 12px;line-height:1.5;font-size:15px}
  .rules b{color:#fff} .rules .y{color:var(--gold);font-weight:800} .rules .r{color:var(--red);font-weight:800}
  .steps{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin:6px 0 10px}
  .steps>div{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
  .steps>div>span{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:var(--orange);color:#1b0d00;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center}
  .steps p{margin:0;font-size:15px;line-height:1.45}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:380px;width:100%}
  .modal .box p{margin:0 0 16px;line-height:1.5}
  .empty{text-align:center;padding:40px 16px;color:var(--muted);line-height:1.6}
  .adminbtn{margin-left:auto;background:transparent;border:1px solid var(--gold) !important;color:var(--gold) !important;font-size:13px !important}
</style>

<body>
<header>
  <span class="pill">REGLAS OFICIALES</span><span>(Anti viejos gaga · Ganen o Mueran)</span>

  <h2 class="sub">Messi Cup <i>·</i> Champions League</h2>
</header>
<nav id="nav">
  <button data-v="grupos">📊 Grupos</button>
  <button data-v="mesas">🍺 Mesas</button>

<script>
// ===== Configuración de esta versión =====
const LIVE = true;            // true: GitHub (en vivo, solo organizador carga) · false: Claude (todos usan su copia)
const NTFY = "https://ntfy.sh/turbo-mundial-bp-v5-h2x8q4";
const ADMIN_CODE = "admin-mc7k2q";
const KEY = "tmbp-v5";
const ADMIN_FLAG = "tmbp-v3-admin";   // mismo permiso de organizador que la versión anterior

const MAX = 24, MIN = 4, MAXG = 6;
const DEFAULT_TEAMS = [
  "Ivan / Brunito / Pedro Guastavino",
  "Tito / Francesca Giacomi / Luis",
  "Franco Gonzalez / Gonza I / Ema Sanchez",
  "Juanita / Mauro / Tino",
  "Botacchi / Massi / Marcos",
  "Florian / Pollo / Justo Echevarria",
  "Marini / Pipe Juarez / Luli Da Cuna",
  "Juli Gariboti / Tano / Agus Hernandez",
  "Gero Vacca / Tomas Moavro / Santi Gonzalez",
  "Bocha / Ampi / Tincho",
  "Toto Costa / Justo Guastavino / Santi Mora",
  "Salva / Dogui / Cala"
];
const LETTERS = ["A","B","C","D","E","F"];
const FIX = {   // orden de partidos por cantidad de equipos en el grupo
  3: [[[0,1]],[[0,2]],[[1,2]]],
  4: [[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]],
  5: [[[0,1],[2,3]],[[0,2],[1,4]],[[0,3],[2,4]],[[0,4],[1,3]],[[1,2],[3,4]]]
};
const VIEWS = ["grupos","mesas","llaves","equipos","reglas"];
const tableName = i => i===0 ? "Mesa 1 · Ping pong" : "Mesa " + (i+1);
const MAXT = 8;

// ===== formato automático según la cantidad de equipos =====
function formatFor(n){
  const G = n <= 5 ? 1 : Math.round(n/4);
  const base = Math.floor(n/G), extra = n % G;
  const sizes = Array.from({length:G}, (_,i)=> base + (i < extra ? 1 : 0));
  let K = 1; while (K < 2*G) K *= 2;           // la menor potencia de 2 que entra a los 2 primeros de cada grupo
  if (K > 3*G) K /= 2;                         // si haría falta más que los terceros, se achica
  const direct = Math.floor(K/G), extraQ = K % G; // pasan directo los primeros "direct" de cada grupo; después los mejores del siguiente puesto
  return { n, G, sizes, K, direct, extraQ };
}
const roundName = size => ({2:"Final",4:"Semis",8:"Cuartos",16:"Octavos"})[size] || ("Ronda de " + size);

// ===== organizador =====
let isAdmin = !LIVE;
if (LIVE){
  try { isAdmin = localStorage.getItem(ADMIN_FLAG) === "1"; } catch(e){}
  const h = location.hash.slice(1);
  if (h === ADMIN_CODE){ isAdmin = true; try{ localStorage.setItem(ADMIN_FLAG,"1"); }catch(e){} try{ history.replaceState(null,"","#grupos"); }catch(e){} }
  if (h === "salir"){ isAdmin = false; try{ localStorage.removeItem(ADMIN_FLAG); }catch(e){} try{ history.replaceState(null,"","#grupos"); }catch(e){} }
}
const RO = () => !isAdmin;

// ===== estado =====
function randTb(){ return Array.from({length:MAX}, ()=>Math.random()); }
function freshTables(c=3){ return Array.from({length:c}, ()=>({hold:false, match:null})); }
function fresh(){
  return { n: 12, names: Array(MAX).fill(""), players: Array.from({length:MAX},(_,i)=>DEFAULT_TEAMS[i]||""),
           gn: LETTERS.map(l=>"Grupo "+l), g: null, r: {}, k: {}, d: {}, m: freshTables(), pl: true, tb: randTb() };
}
let S = fresh();
if (isAdmin){ try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.players) S = Object.assign(fresh(), s); } catch(e){} }
let view = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "grupos";

const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tname = id => (S.names[id]||"").trim() || ("Equipo " + (id+1));
const okId = x => Number.isInteger(x) && x>=0 && x<S.n;
const pkey = (a,b) => Math.min(a,b) + "-" + Math.max(a,b);
const F = () => formatFor(S.n);
function groupStart(gi){ const s = F().sizes; let o = 0; for (let i=0;i<gi;i++) o += s[i]; return o; }
const groupIds = gi => S.g ? S.g.slice(groupStart(gi), groupStart(gi) + F().sizes[gi]) : [];
const groupOf = id => { if (!S.g) return -1; const p = S.g.indexOf(id), s = F().sizes; let o = 0; for (let i=0;i<s.length;i++){ if (p < o + s[i]) return i; o += s[i]; } return -1; };
const fixtureOf = gi => FIX[F().sizes[gi]];

// ===== tablas =====
function standings(gi){
  const ids = groupIds(gi), fx = fixtureOf(gi);
  const rows = ids.map(id=>({id, gi, pj:0, pg:0, pp:0, pts:0}));
  const by = Object.fromEntries(rows.map(r=>[r.id,r]));
  let played = 0, total = 0;
  for (const f of fx) for (const [i,j] of f){
    total++;
    const a = ids[i], b = ids[j], w = S.r[pkey(a,b)];
    if (w!==a && w!==b) continue;
    played++;
    const W = by[w], L = by[w===a?b:a];
    W.pj++; L.pj++; W.pg++; W.pts++; L.pp++;
  }
  const rk = rank(rows, "g"+gi, true, false);
  return { rows: rk.rows, pend: rk.pend, done: played===total };
}
// Desempate en el grupo: 1) puntos · 2) si empatan 2, partido entre ellos · 3) si empatan 3 o más, desempate en la mesa
// Entre grupos distintos (mejores segundos/terceros): % de partidos ganados y, si empatan, sorteo
function rank(rows, key, h2h, auto){
  const val = r => auto ? (r.pj ? r.pts/r.pj : 0) : r.pts;
  rows.sort((x,y)=> (val(y)-val(x)) || (S.tb[y.id]-S.tb[x.id]));
  const out = [], pend = [];
  let i = 0;
  while (i < rows.length){
    let j = i; while (j < rows.length && val(rows[j]) === val(rows[i])) j++;
    let cl = rows.slice(i, j);
    if (cl.length === 2 && h2h){
      const w = S.r[pkey(cl[0].id, cl[1].id)];
      if (w === cl[1].id) cl = [cl[1], cl[0]];
    } else if (cl.length >= 2 && !auto){
      const dk = key + ":" + cl[0].pts, ids = cl.map(x=>x.id), ord = (S.d||{})[dk];
      if (Array.isArray(ord) && ord.length === ids.length && ord.every(x=>ids.includes(x))) cl = ord.map(id=>cl.find(x=>x.id===id));
      else pend.push({ dk, ids, pts: cl[0].pts, partial: Array.isArray(ord) ? ord.filter(x=>ids.includes(x)) : [] });
    }
    out.push(...cl); i = j;
  }
  return { rows: out, pend };
}
const allDone = () => !!S.g && Array.from({length:F().G},(_,gi)=>gi).every(gi=>standings(gi).done);
const tiesReady = () => allDone() && Array.from({length:F().G},(_,gi)=>gi).every(gi=>standings(gi).pend.length===0);
function tierRank(p){ return rank(Array.from({length:F().G},(_,gi)=>standings(gi).rows[p]).filter(Boolean), "t", false, true).rows; }

// ===== llaves =====
function bracketOrder(K){ let o = [1]; while (o.length < K){ const m = o.length*2+1; o = o.flatMap(s=>[s, m-s]); } return o; }
function seeds(){
  if (!tiesReady()) return null;
  const f = F(), list = [];
  for (let p=0; p<f.direct; p++) list.push(...tierRank(p));
  if (f.extraQ) list.push(...tierRank(f.direct).slice(0, f.extraQ));
  return list.slice(0, f.K);
}
// ranking de los que quedaron afuera de la Copa de Oro, para la Copa de Plata
function eliminated(){
  const sd = seeds(); if (!sd) return null;
  const q = new Set(sd.map(r=>r.id)), order = [], maxS = Math.max(...F().sizes);
  for (let p=0; p<maxS; p++) order.push(...tierRank(p));
  return order.filter(r=>!q.has(r.id));
}
const plataCount = () => S.n - F().K;
function plataSize(){ const E = plataCount(); if (!S.pl || E < 2) return 0; let P = 1; while (P < E) P *= 2; return P; }
function pairUp(list, size){       // list: equipos ordenados (mejor primero); los lugares que faltan son pases directos para los mejores
  const ord = bracketOrder(size), pairs = [];
  for (let i=0;i<size;i+=2) pairs.push([list[ord[i]-1]||null, list[ord[i+1]-1]||null]);
  for (let a=0;a<pairs.length;a++){   // evitar dos del mismo grupo en la primera ronda
    const [x,y] = pairs[a]; if (!x || !y || groupOf(x.id) !== groupOf(y.id)) continue;
    for (let b=0;b<pairs.length;b++){
      if (b===a || !pairs[b][0] || !pairs[b][1]) continue;
      if (groupOf(x.id) !== groupOf(pairs[b][1].id) && groupOf(pairs[b][0].id) !== groupOf(y.id)){ const t = pairs[a][1]; pairs[a][1] = pairs[b][1]; pairs[b][1] = t; break; }
    }
  }
  return pairs.map(p=>p.map(r=>r ? r.id : null));
}
function firstRound(pre){
  if (pre==="p"){ const P = plataSize(), el = eliminated(); return P && el ? pairUp(el, P) : null; }
  const sd = seeds(); return sd ? pairUp(sd, F().K) : null;
}
function rounds(pre){ const K = pre==="p" ? plataSize() : F().K, R = []; for (let s=K; s>=2; s/=2) R.push(s); return R; }
const koKey = (pre,ri,i) => pre+ri+"m"+i;
const parseKey = m => { const [ri,i] = m.slice(1).split("m").map(Number); return {pre:m[0], ri, i}; };
function koList(pre){ const out = []; rounds(pre).forEach((s,ri)=>{ for (let i=0;i<s/2;i++) out.push(koKey(pre,ri,i)); }); return out; }
const finalKey = pre => koKey(pre, rounds(pre).length-1, 0);
function koLabel(m){
  const {pre, ri, i} = parseKey(m), s = rounds(pre)[ri];
  return (pre==="p" ? "Plata · " : "") + (s===2 ? "Final" : roundName(s) + " " + (i+1));
}
function sides(m){
  const {pre, ri, i} = parseKey(m);
  if (ri===0){
    const fr = firstRound(pre);
    if (!fr) return [{id:null,label:"Se define en grupos"},{id:null,label:"Se define en grupos"}];
    return fr[i].map(id=> id===null ? {id:null, bye:true, label:"Pasa directo"} : {id});
  }
  return [koKey(pre,ri-1,2*i), koKey(pre,ri-1,2*i+1)].map(x=>({id:winner(x), label:"Ganador " + koLabel(x)}));
}
function winner(m){
  const sd = sides(m);
  if (sd[0].bye && sd[1].id!==null) return sd[1].id;     // pase directo
  if (sd[1].bye && sd[0].id!==null) return sd[0].id;
  const w = S.k[m];
  if (!okId(w)) return null;
  return sd.some(s=>s.id===w) ? w : null;
}
function seedLabel(id){
  const g = groupOf(id); if (g<0) return "";
  const pos = standings(g).rows.findIndex(r=>r.id===id);
  return (pos+1) + "° " + LETTERS[g];
}

// ===== mesas =====
function allMatches(){
  const out = [];
  if (!S.g) return out;
  const f = F(), maxF = Math.max(...f.sizes.map(s=>FIX[s].length));
  for (let fi=0; fi<maxF; fi++) for (let gi=0; gi<f.G; gi++){
    const fx = fixtureOf(gi); if (fi >= fx.length) continue;
    const ids = groupIds(gi);
    for (const [i,j] of fx[fi]) out.push({ id:"g:"+pkey(ids[i],ids[j]), teams:[ids[i],ids[j]], lbl: S.gn[gi] + " · Fecha " + (fi+1), kind:"g", key:pkey(ids[i],ids[j]) });
  }
  const ko = [...koList("r"), ...koList("p")].sort((a,b)=> parseKey(a).ri - parseKey(b).ri);
  for (const m of ko){
    const sd = sides(m);
    if (sd.every(x=>x.id!==null)) out.push({ id:"k:"+m, teams:sd.map(x=>x.id), lbl: koLabel(m), kind:"k", key:m });
  }
  return out;
}
const matchDone = mt => mt.kind==="g" ? (S.r[mt.key]===mt.teams[0] || S.r[mt.key]===mt.teams[1]) : winner(mt.key)!==null;
function tables(){ if (!Array.isArray(S.m) || S.m.length<1 || S.m.length>MAXT) S.m = freshTables(); return S.m; }
function fillTables(){
  const T = tables(), all = allMatches(), byId = Object.fromEntries(all.map(x=>[x.id,x]));
  T.forEach(t=>{ const mt = byId[t.match]; if (!mt || matchDone(mt)) t.match = null; });
  for (const t of T){
    if (t.match || t.hold) continue;
    const busy = new Set(T.flatMap(x=>x.match && byId[x.match] ? byId[x.match].teams : []));
    const onTable = new Set(T.map(x=>x.match).filter(Boolean));
    const next = all.find(mt => !matchDone(mt) && !onTable.has(mt.id) && !mt.teams.some(id=>busy.has(id)));
    if (next) t.match = next.id;
  }
}

  if (!isAdmin) return;
  fillTables();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  if (LIVE){ clearTimeout(pubTimer); pubTimer = setTimeout(publish, 400); }
}
function pack(){
  const n = S.n;
  return JSON.stringify({v:4, t:Date.now(), n, nm:S.names.slice(0,n), p:S.players.slice(0,n), gn:S.gn.slice(0,formatFor(n).G), g:S.g, r:S.r, k:S.k, d:S.d, m:S.m, pl:S.pl, tb:S.tb.slice(0,n)});
}
function unpack(str){
  let d; try { d = JSON.parse(str); } catch(e){ return null; }
  if (!d || d.v!==4 || typeof d.t!=="number" || !Number.isInteger(d.n) || d.n<MIN || d.n>MAX) return null;
  const n = d.n, G = formatFor(n).G, id = x => Number.isInteger(x) && x>=0 && x<n;
  const strArr = (a,len,max) => Array.isArray(a) && a.length===len && a.every(x=>typeof x==="string" && x.length<=max);
  if (!strArr(d.nm,n,28) || !strArr(d.p,n,70) || !strArr(d.gn,G,24)) return null;
  if (d.g!==null && !(Array.isArray(d.g) && d.g.length===n && d.g.every(id) && new Set(d.g).size===n)) return null;
  if (!Array.isArray(d.tb) || d.tb.length!==n || !d.tb.every(x=>typeof x==="number")) return null;
  const r = {}, k = {}, dd = {};
  if (d.r && typeof d.r==="object") for (const [key,val] of Object.entries(d.r)) if (/^\d{1,2}-\d{1,2}$/.test(key) && id(val)) r[key]=val;
  if (d.k && typeof d.k==="object") for (const [key,val] of Object.entries(d.k)) if (/^[rp][0-4]m\d{1,2}$/.test(key) && id(val)) k[key]=val;
  if (d.d && typeof d.d==="object") for (const [key,val] of Object.entries(d.d)) if (/^g[0-5]:\d$/.test(key) && Array.isArray(val) && val.length<=5 && val.every(id) && new Set(val).size===val.length) dd[key]=val;
  let m = freshTables();
  if (Array.isArray(d.m) && d.m.length>=1 && d.m.length<=MAXT) m = d.m.map(t=>({ hold: !!(t&&t.hold), match: (t && typeof t.match==="string" && /^(g:\d{1,2}-\d{1,2}|k:[rp][0-4]m\d{1,2})$/.test(t.match)) ? t.match : null }));
  const pad = (a, fill) => a.concat(Array(MAX - a.length).fill(fill));
  const gn = d.gn.concat(LETTERS.slice(G).map(l=>"Grupo "+l));
  return { t:d.t, n, names:pad(d.nm,""), players:pad(d.p,""), gn, g:d.g, r, k, d:dd, m, pl: d.pl!==false, tb:pad(d.tb,0) };
}
function apply(d){
  lastT = d.t;
  S = { n:d.n, names:d.names, players:d.players, gn:d.gn, g:d.g, r:d.r, k:d.k, d:d.d, m:d.m, pl:d.pl, tb:d.tb };
  liveState = "Última actualización: " + hhmm(d.t);
  banner(); render();
}
async function publish(){
  try {
    const res = await fetch(NTFY, {method:"POST", body: pack()});
    liveState = res.ok ? "✅ Publicado " + hhmm(Date.now()) : "⚠️ No se pudo publicar (" + res.status + "). Tocá de nuevo en un rato.";
  } catch(e){ liveState = "⚠️ Sin conexión: el cambio quedó en tu celular y se publica en el próximo cambio."; }
  banner();
}
async function pollLatest(){
  try {
    const txt = await (await fetch(NTFY + "/json?poll=1&since=12h")).text();
    let best = null;
    for (const line of txt.split("\n")){
      if (!line.trim()) continue;
      let o; try { o = JSON.parse(line); } catch(e){ continue; }
      if (o.event!=="message") continue;
      const d = unpack(o.message);
      if (d && (!best || d.t > best.t)) best = d;
    }
    if (best && best.t > lastT) apply(best);
    else if (!best && !lastT){ liveState = "Esperando que arranque el torneo…"; banner(); }
  } catch(e){ liveState = "⚠️ No se pudo conectar. Reintentando…"; banner(); }
}
function follow(){
  pollLatest();
  try {
    const es = new EventSource(NTFY + "/sse");
    es.onmessage = e => { let o; try { o = JSON.parse(e.data); } catch(err){ return; } if (o.event==="message"){ const d = unpack(o.message); if (d && d.t > lastT) apply(d); } };
    es.onopen = () => pollLatest();
  } catch(e){}
  setInterval(pollLatest, 60000);
  document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) pollLatest(); });
}
function banner(){
  const b = document.getElementById("live");
  if (!LIVE){ b.style.display = "none"; return; }
  b.style.display = "block";
  b.innerHTML = (isAdmin ? "<b>🔴 EN VIVO</b> · Vos cargás, todos lo ven." : "<b>🔴 EN VIVO</b> · Se actualiza solo.") + (liveState ? " " + esc(liveState) : "");
}

// ===== acciones =====
function confirmBox(msg, ok){
  const m = document.getElementById("modal");
  m.innerHTML = `<div class="modal"><div class="box"><p>${msg}</p>
    <div class="bar" style="margin:0;justify-content:flex-end"><button class="btn ghost" id="mNo">Cancelar</button><button class="btn" id="mYes">Sí, dale</button></div></div></div>`;
  document.getElementById("mNo").onclick = ()=> m.innerHTML="";
  document.getElementById("mYes").onclick = ()=>{ m.innerHTML=""; ok(); };
}
function clearTournament(){ S.g = null; S.r = {}; S.k = {}; S.d = {}; S.m = freshTables(tables().length); }
function doSorteo(){
  const ids = Array.from({length:S.n},(_,i)=>i);
  for (let i=ids.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]; }
  clearTournament(); S.g = ids; S.tb = randTb();
  save(); go("grupos");
}
function setN(n){
  n = Math.max(MIN, Math.min(MAX, n)); if (n===S.n) return;
  const doIt = ()=>{ S.n = n; clearTournament(); save(); render(); };
  if (S.g) confirmBox(`Cambiar a ${n} equipos borra los grupos y resultados actuales (los nombres y jugadores quedan). ¿Seguro?`, doIt); else doIt();
}
function go(v){ view = v; try{ history.replaceState(null,"","#"+v); }catch(e){} render(); window.scrollTo(0,0); }
const hasResults = () => Object.keys(S.r).length || Object.keys(S.k).length;

document.getElementById("nav").addEventListener("click", e=>{
  const b = e.target.closest("button[data-v]"); if (b) go(b.dataset.v);
});
document.getElementById("app").addEventListener("click", e=>{
  if (RO()) return;
  const a = e.target.closest("[data-act]");
  if (a){
    const act = a.dataset.act;
    if (act==="sorteo"){ if (S.g && hasResults()) confirmBox("Re-sortear borra todos los resultados. ¿Seguro?", doSorteo); else doSorteo(); }
    if (act==="reset") confirmBox("Esto borra grupos y resultados (nombres y jugadores quedan). ¿Seguro?", ()=>{ clearTournament(); save(); go("equipos"); });
    if (act==="nplus") setN(S.n+1);
    if (act==="nminus") setN(S.n-1);
    if (act==="mplus" || act==="mminus"){
      const T = tables();
      if (act==="mplus" && T.length < MAXT) T.push({hold:false, match:null});
      if (act==="mminus" && T.length > 1) T.pop();     // el partido de la mesa que se saca vuelve a la fila
      save(); render();
    }
    return;
  }
  const dk = e.target.closest("[data-dk]");
  if (dk){ const key = dk.dataset.dk, id = +dk.dataset.id; S.d = S.d || {}; const cur = (S.d[key]||[]).slice(); if (!cur.includes(id)) cur.push(id); S.d[key] = cur; save(); render(); return; }
  const dr = e.target.closest("[data-dkr]");
  if (dr){ S.d = S.d || {}; delete S.d[dr.dataset.dkr]; save(); render(); return; }
  const r = e.target.closest("[data-res]");
  if (r){ const key = r.dataset.res, id = +r.dataset.id; if (S.r[key]===id) delete S.r[key]; else S.r[key]=id; save(); render(); return; }
  const k = e.target.closest("[data-ko]");
  if (k){ const m = k.dataset.ko, id = +k.dataset.id; if (winner(m)===id) delete S.k[m]; else S.k[m]=id; save(); render(); }
});
document.getElementById("app").addEventListener("change", e=>{
  if (RO()) return;
  const t = e.target;
  if (t.dataset.name!==undefined){ S.names[+t.dataset.name] = t.value.slice(0,28); save(); render(); return; }
  if (t.dataset.plToggle!==undefined){ S.pl = t.checked; save(); render(); return; }
  if (t.dataset.pl!==undefined){ S.players[+t.dataset.pl] = t.value.slice(0,70); save(); return; }
  if (t.dataset.gn!==undefined){ S.gn[+t.dataset.gn] = t.value.slice(0,24) || ("Grupo " + LETTERS[+t.dataset.gn]); save(); render(); return; }
  if (t.dataset.tbl!==undefined){
    const T = tables(), i = +t.dataset.tbl, val = t.value || null;
    const other = val ? T.findIndex((x,j)=>j!==i && x.match===val) : -1;
    if (other!==-1) T[other].match = T[i].match;   // si ya estaba en otra mesa, se intercambian
    T[i].match = val; T[i].hold = !val;            // "Libre" a mano: queda en pausa hasta que elijas un partido
    save(); render(); return;
  }
  if (t.dataset.slot!==undefined){
    const slot = +t.dataset.slot, id = +t.value, other = S.g.indexOf(id);
    if (other!==-1 && other!==slot){ S.g[other] = S.g[slot]; }
    S.g[slot] = id; save(); render();
  }
});
window.addEventListener("hashchange", ()=>{ const h = location.hash.slice(1); if (VIEWS.includes(h)){ view = h; render(); } });

if (LIVE && isAdmin){
  const b = document.createElement("button"); b.className = "adminbtn"; b.textContent = "🔑 Organizador · Salir";
  b.onclick = ()=> confirmBox("¿Salir del modo organizador en este celular? Vas a ver la página como la gente. Para volver, abrí de nuevo tu link secreto.", ()=>{
    try{ localStorage.removeItem(ADMIN_FLAG); }catch(e){} location.hash = "grupos"; location.reload(); });
  document.getElementById("nav").appendChild(b);
}
render(); banner();
if (LIVE){ if (isAdmin){ if (S.g) publish(); } else follow(); }
</script>
